<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1f24">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>GARNETA SYSTEM</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="/assets/css/app-updates.css?v=3">
  <link rel="stylesheet" href="/assets/css/neural-dashboard.css?v=3">
  <link rel="stylesheet" href="/assets/css/progressive-ui.css?v=3">
  <link rel="stylesheet" href="/assets/css/smart-search.css?v=3">
  <link rel="stylesheet" href="/assets/css/ai-input-center.css?v=3">
  <link rel="stylesheet" href="/assets/css/neural-hub-dashboard.css?v=3">
  <style>
    :root {
      --green: #24f0c7;
      --mint: #8df7df;
      --orange: #ff7043;
      --dark: #e8fbff;
      --line: rgba(141, 247, 223, .16);
      --page: #0b1f24;
      --surface: #102a31;
      --surface-2: #142f38;
      --soft-text: #8fb4bd;
      --text: #e8fbff;
      --card-bg: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
      --field-bg: rgba(6,19,24,.68);
      --topbar-bg: rgba(9,28,34,.86);
      --sidebar-bg: linear-gradient(180deg, rgba(13,38,45,.96), rgba(8,24,29,.98));
      --nav-text: #dffcff;
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient(circle at 15% 0%, rgba(36,240,199,.16), transparent 26%), radial-gradient(circle at 95% 8%, rgba(255,112,67,.12), transparent 28%), var(--page); color: var(--text); }
    button, input, select, textarea { font: inherit; }
    .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .sidebar { background: var(--sidebar-bg); color: var(--nav-text); padding: 18px; border-right: 1px solid var(--line); box-shadow: 18px 0 48px rgba(0,0,0,.22); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; min-width: 0; }
    .brand-logo { width: 44px; height: 44px; flex: 0 0 44px; filter: drop-shadow(0 10px 22px rgba(36,240,199,.22)); }
    .brand-title { display: block; font-size: 19px; font-weight: 950; line-height: 1.02; letter-spacing: 1.4px; color: #f8ffff; text-transform: uppercase; text-shadow: 0 2px 14px rgba(36,240,199,.18); }
    .brand-subtitle { display: block; margin-top: 5px; font-size: 9px; font-weight: 900; letter-spacing: 2.2px; color: var(--mint); text-transform: uppercase; }
    .nav { display: grid; gap: 8px; }
    .nav button { border: 1px solid rgba(141,247,223,.1); border-radius: 10px; padding: 11px 12px; cursor: pointer; text-align: left; color: var(--nav-text); background: rgba(255,255,255,.045); }
    .nav button.active, .nav button:hover { background: linear-gradient(135deg, rgba(36,240,199,.22), rgba(255,112,67,.14)); border-color: rgba(36,240,199,.34); box-shadow: 0 0 22px rgba(36,240,199,.12); }
    .main, .content, .card, .table-wrap { min-width: 0; }
    .main { position: relative; isolation: isolate; }
    .page-watermark { position: fixed; right: clamp(12px, 5vw, 82px); bottom: clamp(18px, 6vh, 74px); width: min(var(--watermark-size, 44vw), 680px); aspect-ratio: 1; background: url("/assets/images/basket-watermark.svg") center / contain no-repeat; opacity: .14; pointer-events: none; z-index: 0; filter: drop-shadow(0 24px 60px rgba(36,240,199,.08)); display: grid; place-items: center; }
    .page-watermark-text { max-width: 82%; text-align: center; color: var(--watermark-text-color, var(--mint)); font-size: clamp(14px, var(--watermark-text-size, 4vw), 96px); font-weight: 950; letter-spacing: 5px; text-transform: uppercase; text-shadow: 0 12px 34px rgba(0,0,0,.28); transform: translateY(8%); }
    .topbar, .content { position: relative; z-index: 1; }
    .topbar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 18px; background: var(--topbar-bg); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); box-shadow: 0 16px 40px rgba(0,0,0,.18); }
    .content { padding: 18px; }
    .card { background: var(--card-bg); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 22px 54px rgba(0,0,0,.28); }
    .grid { display: grid; gap: 14px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .forms { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: rgba(255,255,255,.05); color: #e8fbff; cursor: pointer; font-weight: 800; }
    .btn.primary { border: 0; color: #062024; background: linear-gradient(135deg, var(--green), var(--orange)); box-shadow: 0 10px 24px rgba(36,240,199,.18); }
    .btn.danger { color: #ffd2c5; background: rgba(255,112,67,.12); border-color: rgba(255,112,67,.34); }
    .btn.soft { color: var(--mint); background: rgba(36,240,199,.1); border-color: rgba(36,240,199,.28); }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; }
    input, select, textarea { width: 100%; border: 1px solid rgba(141,247,223,.18); border-radius: 10px; padding: 9px 10px; background: var(--field-bg); color: var(--text); outline: none; }
    input:focus, select:focus, textarea:focus { border-color: rgba(36,240,199,.62); box-shadow: 0 0 0 3px rgba(36,240,199,.09); }
    table { width: 100%; border-collapse: collapse; background: var(--field-bg); border-radius: 12px; overflow: hidden; }
    th, td { border-bottom: 1px solid rgba(141,247,223,.1); padding: 10px; text-align: left; font-size: 14px; vertical-align: top; }
    th { background: rgba(127,127,127,.08); color: var(--text); font-size: 12px; text-transform: uppercase; }
    .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; -webkit-overflow-scrolling: touch; }
    .muted { color: var(--soft-text); }
    .hidden { display: none !important; }
    .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15,23,42,.45); padding: 20px; z-index: 20; }
    .modal .card { max-width: 420px; width: 100%; }
    .chart { display: flex; align-items: end; gap: 8px; height: 180px; padding-top: 12px; }
    .bar { min-width: 24px; flex: 1; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, var(--orange), var(--green)); }
    textarea.input-area { min-height: 120px; resize: vertical; }
    video.scanner-preview { width: 100%; height: min(62vh, 520px); min-height: 260px; border-radius: 14px; border: 1px solid var(--line); background: #020617; object-fit: contain; }
    .settings-page { background: radial-gradient(circle at 20% 0%, rgba(34,211,238,.16), transparent 28%), #090a10; color: #f8fafc; border-radius: 8px; padding: 22px; min-height: calc(100vh - 118px); }
    .settings-hero, .api-center-card, .api-help-card { background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); border: 1px solid rgba(148,163,184,.18); border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.32); }
    .settings-hero { padding: 22px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .settings-kicker { color: #67e8f9; font-size: 11px; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; }
    .settings-title { margin: 8px 0 4px; font-size: 24px; font-weight: 900; }
    .settings-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    .settings-tabs button { border: 1px solid rgba(148,163,184,.24); border-radius: 999px; padding: 10px 22px; background: rgba(255,255,255,.05); color: #dbeafe; font-weight: 900; cursor: pointer; }
    .settings-tabs button.active { background: linear-gradient(135deg, #2563eb, #7c3aed); border-color: transparent; color: white; }
    .api-center-card { max-width: 560px; padding: 20px; display: grid; gap: 16px; }
    .api-section-title { color: #facc15; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; }
    .api-badges { display: flex; flex-wrap: wrap; gap: 10px; }
    .api-badge { border: 1px solid rgba(148,163,184,.22); border-radius: 999px; padding: 9px 13px; background: rgba(2,6,23,.68); color: #e2e8f0; font-size: 12px; font-weight: 900; }
    .api-badge.ok { border-color: rgba(16,185,129,.55); color: #99f6e4; }
    .api-badge.warn { border-color: rgba(245,158,11,.65); color: #fde68a; }
    .api-key-box { display: grid; gap: 8px; }
    .api-key-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .api-key-display { border: 1px solid rgba(148,163,184,.22); border-radius: 14px; background: #090a10; padding: 13px 14px; color: #cbd5e1; font-weight: 900; overflow-wrap: anywhere; }
    .api-form-grid { display: grid; gap: 12px; }
    .api-form-grid select, .api-form-grid input, .api-form-grid textarea { width: 100%; border: 1px solid rgba(148,163,184,.24); border-radius: 14px; background: #090a10; color: #f8fafc; padding: 13px 14px; outline: none; }
    .api-form-grid textarea { min-height: 132px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    #ai-api-keys[data-hidden="true"] { -webkit-text-security: disc; }
    .api-form-grid option { color: #0f172a; }
    .api-key-list { display: grid; gap: 8px; }
    .api-key-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid rgba(148,163,184,.18); border-radius: 14px; background: rgba(2,6,23,.62); padding: 10px 12px; color: #cbd5e1; font-size: 12px; }
    .api-key-item strong { color: #f8fafc; }
    .api-key-display-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
    .api-edit-overlay { grid-column: 1 / -1; width: 100%; margin-top: 10px; grid-template-columns: 1fr auto auto; gap: 8px; padding: 12px; border-radius: 14px; border: 1px solid rgba(34,211,238,.24); background: rgba(2,6,23,.9); box-shadow: inset 0 0 0 1px rgba(255,255,255,.03); }
    .api-edit-overlay input { border: 1px solid rgba(148,163,184,.24); border-radius: 12px; background: #090a10; color: #f8fafc; padding: 10px 12px; }
    .api-key-input-list { display: grid; gap: 8px; }
    .api-key-input-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
    .api-primary { border: 0; border-radius: 14px; padding: 13px 18px; color: white; font-weight: 900; background: linear-gradient(135deg, #7c3aed, #2563eb); cursor: pointer; }
    .api-warning { border: 1px solid rgba(245,158,11,.55); background: rgba(120,53,15,.36); color: #fde68a; border-radius: 14px; padding: 13px 14px; font-size: 13px; }
    .api-help-card { padding: 16px; color: #cbd5e1; }
    .api-help-card ol { margin: 10px 0 0; padding-left: 20px; line-height: 1.75; }
    .api-status-text { color: #a7f3d0; font-weight: 800; }
    .theme-panel { max-width: 560px; margin-top: 16px; padding: 20px; display: grid; gap: 14px; background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); border: 1px solid rgba(148,163,184,.18); border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.24); }
    .theme-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .theme-grid label { color: var(--text); }
    .theme-grid select { height: 44px; }
    .theme-grid input[type="color"] { height: 44px; padding: 4px; background: #090a10; border-color: rgba(148,163,184,.24); cursor: pointer; }
    .theme-preview { height: 52px; border: 1px solid rgba(148,163,184,.2); border-radius: 14px; background: linear-gradient(135deg, var(--green), var(--orange)); }
    .brand-preview-grid { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: center; }
    .asset-preview { width: 78px; height: 78px; border-radius: 18px; border: 1px solid rgba(148,163,184,.24); background: rgba(2,6,23,.55) center / contain no-repeat; }
    .range-row { display: grid; grid-template-columns: 1fr 54px; gap: 10px; align-items: center; }
    .edit-overlay { display: none; }
    .edit-overlay.active { display: grid; }
    
    /* Workspace Toolbar Styles */
    .barang-workspace { display: flex; flex-direction: column; gap: 16px; }
    .workspace-toolbar { 
      display: flex; 
      gap: 8px; 
      padding: 12px; 
      background: var(--card-bg); 
      border: 1px solid var(--line); 
      border-radius: 12px; 
      flex-wrap: wrap;
    }
    .workspace-tab { 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      padding: 10px 16px; 
      border: 1px solid rgba(141,247,223,.2); 
      border-radius: 10px; 
      background: rgba(255,255,255,.05); 
      color: var(--nav-text); 
      cursor: pointer; 
      font-weight: 700; 
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .workspace-tab:hover { 
      background: rgba(36,240,199,.15); 
      border-color: rgba(36,240,199,.4); 
    }
    .workspace-tab.active { 
      background: linear-gradient(135deg, rgba(36,240,199,.25), rgba(255,112,67,.15)); 
      border-color: rgba(36,240,199,.5); 
      box-shadow: 0 4px 12px rgba(36,240,199,.15);
    }
    .workspace-icon { font-size: 16px; }
    .workspace-label { white-space: nowrap; }
    .workspace-content { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    
    @media (max-width: 768px) {
      .workspace-toolbar { padding: 8px; gap: 6px; }
      .workspace-tab { padding: 8px 12px; font-size: 12px; }
      .workspace-icon { font-size: 14px; }
      .workspace-label { display: none; }
    }
    
    @media (min-width: 901px) and (max-width: 1200px) {
      .app { grid-template-columns: 220px 1fr; }
      .forms { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .content { padding: 14px; }
    }
    @media (max-width: 900px) {
      body { font-size: 13px; }
      h2, h3 { margin: 0 0 10px; line-height: 1.15; }
      h2 { font-size: 18px; }
      h3 { font-size: 15px; }
      .app { display: block; min-height: 100vh; }
      .sidebar { position: fixed; left: 10px; right: 10px; bottom: 10px; top: auto; z-index: 30; padding: 8px; border: 1px solid rgba(141,247,223,.2); border-radius: 22px; background: rgba(8,24,29,.92); backdrop-filter: blur(18px); box-shadow: 0 18px 42px rgba(0,0,0,.42); }
      .brand { display: none; }
      .nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
      .nav::-webkit-scrollbar { display: none; }
      .nav button { flex: 0 0 auto; min-width: 74px; max-width: 92px; min-height: 46px; padding: 7px 8px; border-radius: 16px; text-align: center; font-size: 11px; line-height: 1.15; white-space: normal; }
      .main { padding-bottom: 82px; }
      .page-watermark { width: min(72vw, 360px); opacity: .08; right: -42px; bottom: 82px; }
      .topbar { padding: 10px 12px; border-radius: 0 0 20px 20px; }
      #page-title { font-size: 15px; }
      #clock { font-size: 11px; }
      #role-label { display: none; }
      .content { padding: 12px; }
      .grid { gap: 10px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .forms { grid-template-columns: 1fr; }
      .card { border-radius: 18px; padding: 12px; box-shadow: 0 16px 34px rgba(0,0,0,.24); }
      .stats .card { min-height: 82px; padding: 12px; }
      .stats .card .muted { font-size: 11px; }
      .stats .card h2 { font-size: 18px; word-break: break-word; }
      .actions { gap: 6px; }
      .actions .btn, .btn { min-height: 36px; padding: 8px 10px; border-radius: 12px; font-size: 12px; }
      label { font-size: 12px; gap: 5px; }
      input, select, textarea { min-height: 38px; padding: 8px 9px; border-radius: 12px; font-size: 13px; }
      textarea.input-area { min-height: 92px; }
      .table-wrap { border-radius: 14px; max-width: 100%; }
      table { min-width: 640px; }
      th, td { padding: 8px; font-size: 12px; }
      th { font-size: 10px; letter-spacing: .2px; }
      .chart { height: 126px; gap: 5px; }
      .bar { min-width: 12px; border-radius: 6px 6px 0 0; }
      video.scanner-preview { height: min(58vh, 460px); min-height: 280px; border-radius: 16px; }
      .settings-page { padding: 12px; border-radius: 18px; min-height: auto; }
      .settings-hero { padding: 14px; align-items: flex-start; }
      .settings-title { font-size: 18px; }
      .settings-kicker { font-size: 9px; letter-spacing: 4px; }
      .settings-tabs { gap: 6px; margin: 12px 0; }
      .settings-tabs button { padding: 8px 12px; font-size: 11px; }
      .api-center-card, .theme-panel { max-width: 100%; padding: 12px; border-radius: 18px; }
      .api-badge { padding: 7px 9px; font-size: 10px; }
      .api-key-display-row { align-items: flex-start; flex-direction: column; }
      .api-key-item { padding: 10px; border-radius: 16px; }
      .api-edit-overlay, .api-key-input-row { grid-template-columns: 1fr; }
      .theme-grid { grid-template-columns: 1fr; }
      .modal { padding: 12px; }
    }
    @media (max-width: 900px) and (orientation: portrait) {
      .sidebar { position: sticky; top: 0; left: auto; right: auto; bottom: auto; z-index: 40; width: 100%; padding: 8px 10px; border-width: 0 0 1px; border-radius: 0 0 20px 20px; box-shadow: 0 14px 34px rgba(0,0,0,.28); }
      .nav { display: flex; grid-template-columns: none; gap: 6px; overflow-x: auto; padding: 2px 0; }
      .nav button { min-width: 68px; max-width: 86px; min-height: 40px; padding: 6px 7px; font-size: 10.5px; border-radius: 14px; }
      .main { padding-bottom: 0; }
      .topbar { position: sticky; top: 56px; padding: 8px 10px; border-radius: 0 0 16px 16px; }
      .content { padding: 10px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card { padding: 10px; }
      .actions { align-items: stretch; }
      .actions .btn { flex: 1 1 auto; }
      table { min-width: 560px; }
      video.scanner-preview { height: 64vh; min-height: 320px; }
    }
    @media (max-width: 520px) and (orientation: portrait) {
      body { font-size: 12.5px; }
      .nav button { min-width: 62px; max-width: 76px; font-size: 10px; }
      .topbar { top: 52px; }
      .content { padding: 8px; }
      .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
      .stats .card { min-height: 72px; }
      .stats .card h2 { font-size: 15px; }
      .card { border-radius: 16px; }
      .btn { font-size: 11.5px; }
      input, select, textarea { font-size: 12.5px; }
      table { min-width: 520px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" id="brand-logo" src="/assets/images/garneta-basket-logo.svg" alt="Garneta basket logo">
        <div><span class="brand-title">GARNETA<br>SYSTEM</span><span class="brand-subtitle">Move Forward</span></div>
      </div>
      <div class="nav" id="nav"></div>
    </aside>
    <main class="main">
      <div class="page-watermark" id="page-watermark"><div class="page-watermark-text" id="page-watermark-text"></div></div>
      <div class="topbar">
        <div>
          <strong id="page-title">Dashboard</strong>
          <div class="muted" id="clock"></div>
        </div>
        <div class="actions" style="display:flex;align-items:center;gap:12px;flex:1;justify-content:center;">
          <!-- Smart Search di Topbar - INPUT PANJANG -->
          <div id="smart-search-container" style="position:relative;flex:1;max-width:400px;min-width:200px;">
            <!-- Smart Search akan di-render ke sini oleh smart-search.js -->
          </div>
          <span id="role-label" class="muted">Admin</span>
          <button class="btn soft" id="super-login">Super Admin</button>
          <button class="btn danger hidden" id="logout-super">Keluar Super Admin</button>
        </div>
      </div>
      <div class="content" id="content">Memuat data...</div>
    </main>
  </div>

  <div class="modal hidden" id="login-modal">
    <div class="card grid">
      <h3>Masuk Super Admin</h3>
      <label>Nama Super Admin<input id="login-name" list="login-users" autocomplete="username" placeholder="Masukkan nama Super Admin"></label>
      <datalist id="login-users"></datalist>
      <label>Password
        <div style="display:grid;grid-template-columns:1fr auto;gap:8px">
          <input id="login-password" type="password">
          <button class="btn" id="toggle-password">Lihat</button>
        </div>
      </label>
      <div class="actions" style="justify-content:flex-end">
        <button class="btn soft" id="show-create-account">Buat Super Admin</button>
        <button class="btn" id="cancel-login">Batal</button>
        <button class="btn primary" id="submit-login">Masuk</button>
      </div>
      <div id="create-account-panel" class="hidden grid" style="border-top:1px solid var(--line);padding-top:12px">
        <h3>Buat Super Admin</h3>
        <label>Nama Super Admin<input id="create-name" autocomplete="username"></label>
        <label>Password<input id="create-password" type="password" autocomplete="new-password"></label>
        <p class="muted">Hanya boleh ada satu akun Super Admin. Admin biasa tidak perlu login atau daftar akun.</p>
        <div class="actions" style="justify-content:flex-end">
          <button class="btn primary" id="submit-create-account">Simpan Akun</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/assets/js/app-updates.js?v=3"></script>
  <script src="/assets/js/neural-dashboard.js?v=3"></script>
  <script src="/assets/js/progressive-ui.js?v=3"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/assets/js/smart-search.js?v=3"></script>
  <script src="/assets/js/ai-input-center.js?v=3"></script>

    async function gas(action, payload = {}) {
      let response;
      try {
        response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, payload })
        });
      } catch (error) {
        throw new Error("Tidak bisa terhubung ke server. Buka http://127.0.0.1:3000/ atau pastikan node server.js sedang berjalan.");
      }

      const text = await response.text();
      const result = text ? JSON.parse(text) : null;

      if (!response.ok) {
        throw new Error(result?.message || result?.error || `API ${response.status}`);
      }

      return result?.data !== undefined ? result.data : result;
    }

    async function load() {
      state.data = await gas("bootstrap");

    function bindThemeSelector() {
      document.querySelectorAll('[data-theme]').forEach(card => {
        card.addEventListener('click', () => {
          const themeKey = card.dataset.theme;
          applyGarnetaTheme(themeKey);
          // Re-render settings to update UI
          render();
        });
      });
    }

    function applyGarnetaTheme(themeKey) {
      const themes = {
        neural: {
          '--neural-bg': '#0b1f24',
          '--neural-surface': '#102a31',
          '--neural-surface-2': '#142f38',
          '--neural-cyan': '#24f0c7',
          '--neural-cyan-glow': 'rgba(36, 240, 199, 0.4)',
          '--neural-mint': '#8df7df',
          '--neural-orange': '#ff7043',
          '--neural-text': '#e8fbff',
          '--neural-text-soft': '#8fb4bd',
          '--neural-glass': 'rgba(16, 42, 49, 0.85)',
          '--neural-glass-border': 'rgba(141, 247, 223, 0.2)'
        },
        cyber: {
          '--neural-bg': '#0a0a0f',
          '--neural-surface': '#12121a',
          '--neural-surface-2': '#1a1a25',
          '--neural-cyan': '#ff00ff',
          '--neural-cyan-glow': 'rgba(255, 0, 255, 0.4)',
          '--neural-mint': '#ff66ff',
          '--neural-orange': '#00ffff',
          '--neural-text': '#ffffff',
          '--neural-text-soft': '#a0a0b0',
          '--neural-glass': 'rgba(18, 18, 26, 0.9)',
          '--neural-glass-border': 'rgba(255, 0, 255, 0.3)'
        },
        dark: {
          '--neural-bg': '#0d0d0d',
          '--neural-surface': '#1a1a1a',
          '--neural-surface-2': '#262626',
          '--neural-cyan': '#60a5fa',
          '--neural-cyan-glow': 'rgba(96, 165, 250, 0.4)',
          '--neural-mint': '#93c5fd',
          '--neural-orange': '#f87171',
          '--neural-text': '#f5f5f5',
          '--neural-text-soft': '#a3a3a3',
          '--neural-glass': 'rgba(26, 26, 26, 0.9)',
          '--neural-glass-border': 'rgba(96, 165, 250, 0.2)'
        },
        ocean: {
          '--neural-bg': '#0c1a2d',
          '--neural-surface': '#132a47',
          '--neural-surface-2': '#1a3a5c',
          '--neural-cyan': '#00d4ff',
          '--neural-cyan-glow': 'rgba(0, 212, 255, 0.4)',
          '--neural-mint': '#7dd3fc',
          '--neural-orange': '#fbbf24',
          '--neural-text': '#e0f2fe',
          '--neural-text-soft': '#94a3b8',
          '--neural-glass': 'rgba(19, 42, 71, 0.9)',
          '--neural-glass-border': 'rgba(0, 212, 255, 0.25)'
        }
      };
      
      const theme = themes[themeKey];
      if (!theme) return;
      
      const root = document.documentElement;
      Object.entries(theme).forEach(([key, value]) => {
        root.style.setProperty(key, value);
      });
      
      localStorage.setItem('garneta_theme', themeKey);
    }

      if (!rows.length) return `<p class="muted">Belum ada draft nota.</p>`;

        <thead><tr><th>Nama</th><th>Kategori</th><th>Unit</th><th>Isi</th><th>Qty</th><th>Harga Dasar</th><th>Harga Jual</th><th>Aksi</th></tr></thead>

          <tr data-draft-id="${row.id}">
            <td><input data-draft-field="name" value="${escapeAttr(row.name)}"></td>
            <td><input data-draft-field="category" value="${escapeAttr(row.category || "Umum")}"></td>

    function actionTable(collection, rows, keys, labels, formatter) {
      return table(rows, labels.concat(["Aksi"]), (row) => keys.map((key) => td(formatter ? formatter(key, row[key]) : row[key])).join("") + `<td class="actions"><button class="btn soft" data-edit="${collection}" data-id="${row.id}">Edit</button><button class="btn danger" data-delete="${collection}" data-id="${row.id}">Hapus</button></td>`);
    }

    function simpleTable(rows, keys, labels, formatter) {
      return table(rows, labels, (row) => keys.map((key) => td(formatter ? formatter(key, row[key]) : row[key])).join(""));
    }

    function table(rows, labels, body) {
      if (!rows.length) return `<p class="muted">Belum ada data.</p>`;
      return `<div class="table-wrap"><table><thead><tr>${labels.map((label) => `<th>${label}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${body(row)}</tr>`).join("")}</tbody></table></div>`;
    }

    function td(value) {
      return `<td>${value ?? ""}</td>`;
    }

    function input(name, label, required, type = "text", value = "") {
      return `<label>${label}<input name="${name}" type="${type}" value="${value}" ${required ? "required" : ""}></label>`;
    }

    function select(name, label, options) {
      return `<label>${label}<select name="${name}">${options.map((item) => `<option>${item}</option>`).join("")}</select></label>`;
    }

    function hiddenId() {
      return `<input type="hidden" name="id">`;
    }

    function formButtons() {
      return `<div class="actions" style="align-self:end"><button class="btn primary">Simpan</button><button class="btn" type="reset">Reset</button></div>`;
    }

    function priceFormat(key, value) {
      return ["basePrice", "costPrice", "salePrice", "amount", "total", "profitPerUnit", "profit"].includes(key) ? rupiah(value) : value;
    }

    function findProduct(name) {
      return state.data.products.find((product) => product.name.toLowerCase() === String(name || "").trim().toLowerCase());
    }

    function plainNumber(value) {
      const cleaned = String(value ?? "").replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", ".");
      const parsed = Number(cleaned);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function splitRow(line) {
      return String(line).split(/[,;\t]/).map((cell) => cell.trim()).filter((cell) => cell !== "");
    }

    function productFromCells(cells) {
      if (cells.length <= 1) return null;
      return {
        name: cells[0],
        category: cells[1] || "Umum",
        unit: cells[2] || "pcs",
        unitContent: plainNumber(cells[3]) || 1,
        basePrice: plainNumber(cells[4]),
        salePrice: plainNumber(cells[5]),
        stock: plainNumber(cells[6]),
        barcode: cells[7] || ""
      };
    }

    function parseNameQtyUnit(line) {
      const units = ["sak", "karton/dus", "karton", "dus", "jligen", "kg", "ball", "pcs"];
      const pattern = new RegExp(`^(.+?)\\s+(\\d+(?:[.,]\\d+)?)\\s*(${units.map((unit) => unit.replace("/", "\\/")).join("|")})?$`, "i");
      const match = String(line || "").trim().match(pattern);
      if (!match) return null;
      const rawUnit = (match[3] || "pcs").toLowerCase();
      return {
        name: match[1].trim(),
        qty: plainNumber(match[2]),
        unit: rawUnit === "karton" || rawUnit === "dus" ? "karton/dus" : rawUnit
      };
    }

    function parseProductText(text) {
      return String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
        const cells = splitRow(line);
        const fullRow = productFromCells(cells);
        if (fullRow) return fullRow;

        const parsed = parseNameQtyUnit(line);
        if (!parsed) return null;
        return {
          name: parsed.name,
          category: "Umum",
          unit: parsed.unit,
          unitContent: 1,
          basePrice: 0,
          salePrice: 0,
          stock: parsed.qty,
          barcode: ""
        };
      }).filter((row) => row && row.name);
    }

    function parseShoppingText(text) {
      return String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
        const cells = splitRow(line);
        const parsed = cells.length >= 2 ? null : parseNameQtyUnit(line);
        const name = cells.length >= 2 ? cells[0] : (parsed?.name || "");
        const qty = cells.length >= 2 ? plainNumber(cells[1]) : Number(parsed?.qty || 0);
        if (!name || !qty) return null;
        const product = findProduct(name);
        const amount = product ? Number(product.basePrice || 0) : 0;
        return { id: Date.now() + Math.random(), name: name.trim(), unit: parsed?.unit || product?.unit || "", qty, amount, subtotal: qty * amount };
      }).filter(Boolean);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Gagal membaca file gambar."));
        reader.readAsDataURL(file);
      });
    }

    async function readAndCompressImage(file, maxSize = 1280, quality = 0.72) {
      const dataUrl = await readFileAsDataUrl(file);
      return compressImageDataUrl(dataUrl, maxSize, quality);
    }

    function compressImageDataUrl(dataUrl, maxSize = 1280, quality = 0.72) {
      return new Promise((resolve) => {
        const image = new Image();
        image.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
          const width = Math.max(1, Math.round(image.width * scale));
          const height = Math.max(1, Math.round(image.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(image, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        image.onerror = () => resolve(dataUrl);
        image.src = dataUrl;
      });
    }

    async function readProductFile(file) {
      const ext = file.name.split(".").pop().toLowerCase();
      if (["xlsx", "xls"].includes(ext)) {
        if (!window.XLSX) throw new Error("Library Excel belum termuat. Coba koneksi internet aktif atau gunakan CSV.");
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        const first = (rows[0] || []).map((cell) => String(cell).toLowerCase());
        const hasHeader = first.some((cell) => ["nama", "name", "barang", "harga dasar", "baseprice"].includes(cell));
        return (hasHeader ? rows.slice(1) : rows).map((row) => productFromCells(row.map(String))).filter((item) => item && item.name);
      }

      const text = await file.text();
      const lines = text.split(/\r?\n/).filter(Boolean);
      const first = splitRow(lines[0] || "").map((cell) => cell.toLowerCase());
      const hasHeader = first.some((cell) => ["nama", "name", "barang", "harga dasar", "baseprice"].includes(cell));
      return parseProductText((hasHeader ? lines.slice(1) : lines).join("\n"));
    }

    function downloadText(filename, text, type = "text/plain") {
      const blob = new Blob([text], { type });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      anchor.click();
      URL.revokeObjectURL(url);
    }

    function resolveThemeMode(theme) {
      if (theme.mode === "light" || theme.mode === "dark") return theme.mode;
      return isReadableLight(theme.page) ? "light" : "dark";
    }

    function isReadableLight(hexColor) {
      const hex = String(hexColor || "").replace("#", "");
      if (!/^[0-9a-f]{6}$/i.test(hex)) return false;
      const r = parseInt(hex.slice(0, 2), 16) / 255;
      const g = parseInt(hex.slice(2, 4), 16) / 255;
      const b = parseInt(hex.slice(4, 6), 16) / 255;
      const linear = (value) => value <= 0.03928 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
      const luminance = 0.2126 * linear(r) + 0.7152 * linear(g) + 0.0722 * linear(b);
      return luminance > 0.52;
    }

    function softenColor(value, fallback) {
      const hex = String(value || "").replace("#", "");
      if (!/^[0-9a-f]{6}$/i.test(hex)) return fallback;
      const r = parseInt(hex.slice(0, 2), 16);
      const g = parseInt(hex.slice(2, 4), 16);
      const b = parseInt(hex.slice(4, 6), 16);
      const mix = (channel) => Math.round(channel + (255 - channel) * 0.75).toString(16).padStart(2, "0");
      return `#${mix(r)}${mix(g)}${mix(b)}`;
    }

    async function saveInvoiceDraft() {
      try {
        const rows = collectInvoiceDraftFromTable().filter((row) => row.name);
        if (!rows.length) throw new Error("Draft masih kosong.");
        let total = 0;
        for (const row of rows) {
          total += Number(row.basePrice || 0) * Number(row.stock || 0);
          const existing = findProduct(row.name);
          if (existing) {
            await gas("update", { collection: "products", id: existing.id, item: { ...existing, ...row } });
          } else {
            await gas("add", { collection: "products", item: row });
          }
        }
        await gas("add", {
          collection: "purchases",
          item: {
            date: today(),
            invoice: `DRAFT-${Date.now()}`,
            total,
            notes: "Dari draft AI nota"
          }
        });
        saveInvoiceDraftRows([]);
        await load();
        alert("Draft berhasil disimpan ke Barang dan Pembelian.");
      } catch (error) {

      }

    async function startScanner() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Browser belum mendukung akses kamera.");
        }
        const video = el("scanner-video");
        scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = scannerStream;
        video.classList.remove("hidden");
        el("stop-product-scanner").classList.remove("hidden");
        await video.play();

        if (!("BarcodeDetector" in window)) {
          alert("Kamera aktif. Browser belum mendukung deteksi barcode otomatis, isi hasil scanner manual.");
          return;
        }

        const detector = new BarcodeDetector({ formats: ["qr_code", "ean_13", "ean_8", "code_128", "code_39", "upc_a", "upc_e"] });
        scannerActive = true;
        const scan = async () => {
          if (!scannerActive) return;
          try {
            const codes = await detector.detect(video);
            if (codes.length) {
              el("scanner-result").value = codes[0].rawValue;
              scannerActive = false;
              await stopScanner();
              return;
            }
          } catch (error) {
            console.warn(error);
          }
          requestAnimationFrame(scan);
        };
        scan();
      } catch (error) {
        alert(error.message);
      }
    }

    async function stopScanner() {
      scannerActive = false;
      if (scannerStream) {
        scannerStream.getTracks().forEach((track) => track.stop());
        scannerStream = null;
      }
      const video = el("scanner-video");
      if (video) {
        video.pause();
        video.srcObject = null;
        video.classList.add("hidden");
      }
      el("stop-product-scanner")?.classList.add("hidden");
    }

    function escapeAttr(value) {
      return String(value || "")

        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

      el("login-name").value = "";
      el("login-password").value = "";
      el("show-create-account").classList.toggle("hidden", admins.length > 0);
      el("create-account-panel").classList.add("hidden");
      el("login-modal").classList.remove("hidden");
    };
    el("cancel-login").onclick = () => el("login-modal").classList.add("hidden");
    el("toggle-password").onclick = () => {
      const input = el("login-password");
      input.type = input.type === "password" ? "text" : "password";
    };
    el("show-create-account").onclick = () => {
      if (superAdmins().length > 0) {
        alert("Super Admin sudah terdaftar. Hanya boleh ada satu akun Super Admin.");
        return;
      }
      el("create-account-panel").classList.toggle("hidden");
    };
    el("submit-login").onclick = async () => {
      try {
        const user = await gas("login", { name: el("login-name").value.trim(), password: el("login-password").value });
        loginAs(user);
      } catch (error) {
        alert(error.message);
      }
    };
    el("submit-create-account").onclick = async () => {
      try {
        const item = {
          name: el("create-name").value.trim(),
          password: el("create-password").value,
          role: "Super Admin",
          status: "Aktif"
        };
        await gas("add", { collection: "users", item });
        await load();
        const user = await gas("login", { name: item.name, password: item.password });
        loginAs(user);
      } catch (error) {
        alert(error.message);
      }
    };
    el("logout-super").onclick = () => {
      state.role = "Admin";
      state.currentUser = null;
      localStorage.removeItem("role");
      localStorage.removeItem("currentUser");
      renderShell();
      render();
    };

    function loginAs(user) {
      state.role = user.role;
      state.currentUser = user;
      localStorage.setItem("role", state.role);
      localStorage.setItem("currentUser", JSON.stringify(user));
      el("login-modal").classList.add("hidden");
      renderShell();
      render();
    }

    applyTheme();
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
    });
    if ("serviceWorker" in navigator && window.location.protocol !== "file:") {
      navigator.serviceWorker.register("/service-worker.js").catch((error) => console.warn(error));
    }
    setInterval(() => el("clock").textContent = new Date().toLocaleString("id-ID"), 1000);
    load().catch((error) => el("content").innerHTML = `<div class="card"><h2>Error</h2><p>${error.message}</p></div>`);
  </script>
