<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retail Inventory System</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --green: #16a34a;
      --mint: #bbf7d0;
      --orange: #f97316;
      --dark: #0f172a;
      --line: #dbe7dc;
      --page: #f7fbf6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--page); color: var(--dark); }
    button, input, select, textarea { font: inherit; }
    .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .sidebar { background: linear-gradient(160deg, var(--green), #22c55e 58%, var(--orange)); color: white; padding: 18px; }
    .brand { font-size: 20px; font-weight: 800; line-height: 1.2; margin-bottom: 18px; }
    .nav { display: grid; gap: 8px; }
    .nav button { border: 0; border-radius: 8px; padding: 11px 12px; cursor: pointer; text-align: left; color: white; background: rgba(255,255,255,.12); }
    .nav button.active, .nav button:hover { background: rgba(255,255,255,.28); }
    .main { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 18px; background: linear-gradient(90deg, #ffffff, #ecfdf5 55%, #fff7ed); border-bottom: 1px solid var(--line); }
    .content { padding: 18px; }
    .card { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: 0 12px 28px rgba(15,23,42,.06); }
    .grid { display: grid; gap: 14px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .forms { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn { border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; background: white; cursor: pointer; font-weight: 700; }
    .btn.primary { border: 0; color: white; background: linear-gradient(135deg, var(--green), var(--orange)); }
    .btn.danger { color: #c2410c; background: #fff7ed; border-color: #fed7aa; }
    .btn.soft { color: #15803d; background: #f0fdf4; border-color: #bbf7d0; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; }
    input, select, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 7px; padding: 9px 10px; background: white; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 14px; vertical-align: top; }
    th { background: #f8fafc; font-size: 12px; text-transform: uppercase; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
    .muted { color: #64748b; }
    .hidden { display: none !important; }
    .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15,23,42,.45); padding: 20px; z-index: 20; }
    .modal .card { max-width: 420px; width: 100%; }
    .chart { display: flex; align-items: end; gap: 8px; height: 180px; padding-top: 12px; }
    .bar { min-width: 24px; flex: 1; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, var(--orange), var(--green)); }
    textarea.input-area { min-height: 120px; resize: vertical; }
    video.scanner-preview { width: 100%; max-height: 240px; border-radius: 8px; border: 1px solid var(--line); background: #0f172a; object-fit: cover; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: sticky; top: 0; z-index: 6; }
      .nav { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .stats, .forms { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Retail Inventory<br>Web Server</div>
      <div class="nav" id="nav"></div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div>
          <strong id="page-title">Dashboard</strong>
          <div class="muted" id="clock"></div>
        </div>
        <div class="actions">
          <span id="role-label" class="muted">Admin</span>
          <button class="btn soft" id="super-login">Super Admin</button>
          <button class="btn danger hidden" id="logout-super">Keluar Super Admin</button>
        </div>
      </div>
      <div class="content" id="content">Memuat data...</div>
    </main>
  </div>

  <div class="modal hidden" id="login-modal">
    <div class="card grid">
      <h3>Masuk Super Admin</h3>
      <label>Nama Super Admin<input id="login-name" list="login-users" autocomplete="username" placeholder="Masukkan nama Super Admin"></label>
      <datalist id="login-users"></datalist>
      <label>Password
        <div style="display:grid;grid-template-columns:1fr auto;gap:8px">
          <input id="login-password" type="password">
          <button class="btn" id="toggle-password">Lihat</button>
        </div>
      </label>
      <div class="actions" style="justify-content:flex-end">
        <button class="btn soft" id="show-create-account">Buat Super Admin</button>
        <button class="btn" id="cancel-login">Batal</button>
        <button class="btn primary" id="submit-login">Masuk</button>
      </div>
      <div id="create-account-panel" class="hidden grid" style="border-top:1px solid var(--line);padding-top:12px">
        <h3>Buat Super Admin</h3>
        <label>Nama Super Admin<input id="create-name" autocomplete="username"></label>
        <label>Password<input id="create-password" type="password" autocomplete="new-password"></label>
        <p class="muted">Hanya boleh ada satu akun Super Admin. Admin biasa tidak perlu login atau daftar akun.</p>
        <div class="actions" style="justify-content:flex-end">
          <button class="btn primary" id="submit-create-account">Simpan Akun</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const menus = [
      ["dashboard", "Dashboard"], ["barang", "Barang"], ["supplier", "Supplier"],
      ["pembelian", "Pembelian"], ["kalkulator", "Kalkulator Belanja"], ["penjualan", "Penjualan"], ["laporan", "Laporan"],
      ["statistik", "Statistik"], ["users", "Users"]
    ];

    const state = {
      route: "dashboard",
      role: localStorage.getItem("role") || "Admin",
      currentUser: JSON.parse(localStorage.getItem("currentUser") || "null"),
      data: { products: [], suppliers: [], purchases: [], sales: [], users: [], priceHistory: [], dashboard: {} }
    };
    let scannerStream = null;
    let scannerActive = false;

    const rupiah = (value) => new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(Number(value || 0));
    const today = () => new Date().toISOString().slice(0, 10);
    const el = (id) => document.getElementById(id);

    async function gas(action, payload = {}) {
      const response = await fetch("/api", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, payload })
      });

      const text = await response.text();
      const result = text ? JSON.parse(text) : null;

      if (!response.ok) {
        throw new Error(result?.message || result?.error || `API ${response.status}`);
      }

      return result?.data !== undefined ? result.data : result;
    }

    async function load() {
      state.data = await gas("bootstrap");
      renderShell();
      render();
    }

    function renderShell() {
      el("nav").innerHTML = menus.map(([key, label]) => `<button data-route="${key}" class="${state.route === key ? "active" : ""}">${label}</button>`).join("");
      el("nav").querySelectorAll("button").forEach((button) => {
        button.onclick = () => {
          state.route = button.dataset.route;
          renderShell();
          render();
        };
      });
      const superMode = state.role === "Super Admin";
      el("role-label").textContent = superMode ? `Super Admin: ${state.currentUser?.name || ""}` : "Admin";
      el("super-login").classList.toggle("hidden", superMode);
      el("logout-super").classList.toggle("hidden", !superMode);
    }

    function render() {
      const label = menus.find(([key]) => key === state.route)?.[1] || "Dashboard";
      el("page-title").textContent = label;
      if (["laporan", "statistik", "users"].includes(state.route) && state.role !== "Super Admin") {
        el("content").innerHTML = `<div class="card"><h2>Akses dibatasi</h2><p class="muted">Menu ini hanya bisa diakses Super Admin.</p></div>`;
        return;
      }
      const views = { dashboard, barang, supplier, pembelian, kalkulator, penjualan, laporan, statistik, users };
      el("content").innerHTML = views[state.route]();
      bindForms();
    }

    function dashboard() {
      const d = state.data.dashboard || {};
      return `<section class="grid">
        <div class="grid stats">
          ${stat("Barang", d.totalProducts)}
          ${stat("Supplier", d.totalSuppliers)}
          ${stat("Nilai Stok", rupiah(d.stockValue))}
          ${stat("Keuntungan", rupiah(d.totalProfit))}
        </div>
        <div class="card"><h3>Stok Menipis</h3>${simpleTable(d.stockAlerts || [], ["name", "stock", "minStock"], ["Barang", "Stok", "Minimal"])}</div>
      </section>`;
    }

    function barang() {
      return `<section class="grid">
        <div class="card"><h2>Barang</h2>${productForm()}</div>
        <div class="card"><h3>Import Barang</h3>${productImportTools()}</div>
        <div class="card"><h3>Scanner HP</h3>${productScannerTools()}</div>
        <div class="card"><h3>Daftar Barang</h3>${productRows()}</div>
      </section>`;
    }

    function supplier() {
      return crudView("suppliers", "Supplier", supplierForm(), supplierRows());
    }

    function pembelian() {
      return crudView("purchases", "Pembelian", purchaseForm(), purchaseRows());
    }

    function kalkulator() {
      const rows = shoppingRows();
      const total = rows.reduce((sum, row) => sum + shoppingSubtotal(row), 0);
      return `<section class="grid">
        <div class="card">
          <h2>Kalkulator Belanja</h2>
          <form id="shopping-form" class="grid forms">
            ${hiddenId()}
            <label>Nama Barang<input name="name" list="shopping-products" required placeholder="Contoh: Beras Premium"></label>
            <datalist id="shopping-products">${state.data.products.map((p) => `<option value="${p.name}"></option>`).join("")}</datalist>
            ${input("qty", "Banyak Beli", true, "number")}
            ${input("amount", "Harga Dasar", false, "number")}
            ${formButtons()}
          </form>
        </div>
        <div class="card">
          <h3>Copy Paste dari WA</h3>
          <label>Daftar Belanja
            <textarea id="shopping-wa-text" class="input-area" placeholder="Contoh:
Payung 5
Gula Pasir 2
Beras Premium 1"></textarea>
          </label>
          <div class="actions">
            <button class="btn soft" id="parse-shopping-wa">Proses Paste WA</button>
            <button class="btn danger" id="clear-shopping">Kosongkan</button>
          </div>
        </div>
        <div class="card">
          <div class="actions" style="justify-content:space-between">
            <h3>Daftar Belanja</h3>
            <h2>${rupiah(total)}</h2>
          </div>
          ${shoppingTable(rows)}
        </div>
      </section>`;
    }

    function penjualan() {
      return crudView("sales", "Input Penjualan", saleForm(), saleRows());
    }

    function laporan() {
      const rows = dailySales();
      return `<section class="grid">
        <div class="card"><h2>Laporan Penjualan Harian</h2>${simpleTable(rows, ["date", "profit"], ["Tanggal", "Keuntungan"])}</div>
        <div class="card"><h2>Grafik Keuntungan</h2>${barChart(rows.map((row) => row.profit))}</div>
      </section>`;
    }

    function statistik() {
      return `<section class="grid">
        <div class="card"><h2>Statistik Perubahan Harga</h2>${barChart(state.data.priceHistory.map((row) => row.basePrice))}</div>
        <div class="card">${simpleTable(state.data.priceHistory, ["product", "basePrice", "costPrice", "source", "createdAt"], ["Barang", "Harga Dasar", "HPP", "Sumber", "Tanggal"], priceFormat)}</div>
      </section>`;
    }

    function users() {
      return crudView("users", "Akun Super Admin", userForm(), userRows());
    }

    function crudView(collection, title, form, rows) {
      return `<section class="grid">
        <div class="card"><h2>${title}</h2>${form}</div>
        <div class="card"><h3>Daftar ${title}</h3>${rows}</div>
      </section>`;
    }

    function stat(label, value) {
      return `<div class="card"><div class="muted">${label}</div><h2>${value ?? 0}</h2></div>`;
    }

    function productForm() {
      return `<form data-form="products" class="grid forms">
        ${hiddenId()}
        ${input("category", "Kategori Barang")}
        ${input("name", "Nama Barang", true)}
        ${select("unit", "Unit", ["sak", "karton/dus", "jligen", "pcs"])}
        ${input("unitContent", "Isi/Unit", true, "number")}
        ${input("basePrice", "Harga Dasar", true, "number")}
        ${input("salePrice", "Harga Jual/Unit", true, "number")}
        ${input("stock", "Stok", false, "number")}
        ${input("minStock", "Stok Minimal", false, "number")}
        ${input("barcode", "Barcode / Kode Scanner")}
        ${formButtons()}
      </form>`;
    }

    function productImportTools() {
      return `<div class="grid">
        <div class="grid forms">
          <label>File CSV / Excel / Spreadsheet
            <input id="product-import-file" type="file" accept=".csv,.tsv,.txt,.xlsx,.xls">
          </label>
          <div class="actions" style="align-self:end">
            <button class="btn primary" id="import-products-file">Import File</button>
          </div>
        </div>
        <label>Copy paste dari WA / Spreadsheet
          <textarea id="product-wa-text" class="input-area" placeholder="Contoh:
Beras Premium, Beras, sak, 25, 312500, 14500, 10
Gula Pasir 2
Payung, Tepung, sak, 25, 170000, 8500"></textarea>
        </label>
        <div class="actions">
          <button class="btn soft" id="parse-products-wa">Proses Paste WA</button>
        </div>
        <p class="muted">Format header yang didukung: nama, kategori, unit, isi/unit, harga dasar, harga jual, stok, stok minimal, barcode. Jika hanya "Nama 5", stok akan diisi 5.</p>
      </div>`;
    }

    function productScannerTools() {
      return `<div class="grid">
        <div class="grid forms">
          <label>Hasil Scanner<input id="scanner-result" placeholder="Scan barcode atau ketik manual"></label>
          <label>Nama Barang<input id="scanner-product-name" placeholder="Nama barang dari hasil scan"></label>
          <label>Kategori<input id="scanner-product-category" value="Umum"></label>
          <label>Harga Dasar<input id="scanner-base-price" type="number" value="0"></label>
          <label>Unit<select id="scanner-unit"><option>sak</option><option>karton/dus</option><option>jligen</option><option>pcs</option></select></label>
          <label>Isi/Unit<input id="scanner-unit-content" type="number" value="1"></label>
          <label>Harga Jual<input id="scanner-sale-price" type="number" value="0"></label>
          <label>Stok<input id="scanner-stock" type="number" value="0"></label>
        </div>
        <video id="scanner-video" class="scanner-preview hidden" playsinline></video>
        <div class="actions">
          <button class="btn soft" id="start-product-scanner">Buka Kamera HP</button>
          <button class="btn danger hidden" id="stop-product-scanner">Tutup Kamera</button>
          <button class="btn primary" id="save-scanned-product">Simpan Hasil Scan</button>
        </div>
        <p class="muted">Scanner memakai kamera perangkat dan BarcodeDetector jika tersedia. Jika browser belum mendukung, isi kode scanner manual.</p>
      </div>`;
    }

    function supplierForm() {
      return `<form data-form="suppliers" class="grid forms">
        ${hiddenId()}${input("name", "Nama Supplier", true)}${input("phone", "Telepon")}${input("address", "Alamat")}${input("notes", "Catatan")}${formButtons()}
      </form>`;
    }

    function purchaseForm() {
      return `<form data-form="purchases" class="grid forms">
        ${hiddenId()}${input("date", "Tanggal", true, "date", today())}${input("supplier", "Supplier")}${input("product", "Barang")}${input("qty", "Banyak Belanja", true, "number")}${input("amount", "Harga Dasar", true, "number")}${input("notes", "Catatan")}${formButtons()}
      </form>`;
    }

    function saleForm() {
      return `<form data-form="sales" class="grid forms">
        ${hiddenId()}${input("date", "Tanggal", true, "date", today())}
        <label>Nama Barang<select name="productId" required>${state.data.products.map((p) => `<option value="${p.id}">${p.name}</option>`).join("")}</select></label>
        ${input("unitSold", "Unit Terjual", true, "number")}${formButtons()}
      </form>`;
    }

    function userForm() {
      const hasSuperAdmin = state.data.users.some((user) => user.role === "Super Admin");
      return `<form data-form="users" class="grid forms">
        ${hiddenId()}${input("name", "Nama Super Admin", true)}${input("password", hasSuperAdmin ? "Password Baru" : "Password", !hasSuperAdmin, "password")}${select("status", "Status", ["Aktif", "Nonaktif"])}${formButtons()}
        <p class="muted" style="grid-column:1/-1">${hasSuperAdmin ? "Super Admin sudah ada. Form ini hanya untuk mengedit akun yang dipilih dari tabel." : "Belum ada Super Admin. Buat satu akun Super Admin untuk membuka menu khusus."}</p>
      </form>`;
    }

    function productRows() {
      return actionTable("products", state.data.products, ["category", "name", "unit", "unitContent", "basePrice", "costPrice", "salePrice", "stock", "barcode"], ["Kategori", "Nama", "Unit", "Isi", "Harga Dasar", "HPP", "Harga Jual", "Stok", "Barcode"], priceFormat);
    }

    function supplierRows() {
      return actionTable("suppliers", state.data.suppliers, ["name", "phone", "address", "notes"], ["Nama", "Telepon", "Alamat", "Catatan"]);
    }

    function purchaseRows() {
      return actionTable("purchases", state.data.purchases, ["date", "supplier", "product", "qty", "amount", "total"], ["Tanggal", "Supplier", "Barang", "Banyak", "Harga", "Total"], priceFormat);
    }

    function saleRows() {
      return actionTable("sales", state.data.sales, ["date", "product", "unitSold", "unitContent", "qty", "profitPerUnit", "profit"], ["Tanggal", "Barang", "Unit", "Isi", "Banyak", "Profit/Unit", "Keuntungan"], priceFormat);
    }

    function userRows() {
      return actionTable("users", superAdmins(), ["name", "role", "status"], ["Nama", "Role", "Status"]);
    }

    function shoppingRows() {
      return JSON.parse(localStorage.getItem("shoppingRows") || "[]");
    }

    function saveShoppingRows(rows) {
      localStorage.setItem("shoppingRows", JSON.stringify(rows));
    }

    function shoppingSubtotal(row) {
      return Number(row.qty || 0) * Number(row.amount || 0);
    }

    function shoppingTable(rows) {
      return actionTable("shopping", rows, ["name", "qty", "amount", "subtotal"], ["Nama Barang", "Banyak Beli", "Harga Dasar", "Total Jumlah"], (key, value) => key === "amount" || key === "subtotal" ? rupiah(value) : value);
    }

    function actionTable(collection, rows, keys, labels, formatter) {
      return table(rows, labels.concat(["Aksi"]), (row) => keys.map((key) => td(formatter ? formatter(key, row[key]) : row[key])).join("") + `<td class="actions"><button class="btn soft" data-edit="${collection}" data-id="${row.id}">Edit</button><button class="btn danger" data-delete="${collection}" data-id="${row.id}">Hapus</button></td>`);
    }

    function simpleTable(rows, keys, labels, formatter) {
      return table(rows, labels, (row) => keys.map((key) => td(formatter ? formatter(key, row[key]) : row[key])).join(""));
    }

    function table(rows, labels, body) {
      if (!rows.length) return `<p class="muted">Belum ada data.</p>`;
      return `<div class="table-wrap"><table><thead><tr>${labels.map((label) => `<th>${label}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${body(row)}</tr>`).join("")}</tbody></table></div>`;
    }

    function td(value) {
      return `<td>${value ?? ""}</td>`;
    }

    function input(name, label, required, type = "text", value = "") {
      return `<label>${label}<input name="${name}" type="${type}" value="${value}" ${required ? "required" : ""}></label>`;
    }

    function select(name, label, options) {
      return `<label>${label}<select name="${name}">${options.map((item) => `<option>${item}</option>`).join("")}</select></label>`;
    }

    function hiddenId() {
      return `<input type="hidden" name="id">`;
    }

    function formButtons() {
      return `<div class="actions" style="align-self:end"><button class="btn primary">Simpan</button><button class="btn" type="reset">Reset</button></div>`;
    }

    function priceFormat(key, value) {
      return ["basePrice", "costPrice", "salePrice", "amount", "total", "profitPerUnit", "profit"].includes(key) ? rupiah(value) : value;
    }

    function findProduct(name) {
      return state.data.products.find((product) => product.name.toLowerCase() === String(name || "").trim().toLowerCase());
    }

    function plainNumber(value) {
      const cleaned = String(value ?? "").replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", ".");
      const parsed = Number(cleaned);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function splitRow(line) {
      return String(line).split(/[,;\t]/).map((cell) => cell.trim()).filter((cell) => cell !== "");
    }

    function productFromCells(cells) {
      if (cells.length <= 1) return null;
      return {
        name: cells[0],
        category: cells[1] || "Umum",
        unit: cells[2] || "pcs",
        unitContent: plainNumber(cells[3]) || 1,
        basePrice: plainNumber(cells[4]),
        salePrice: plainNumber(cells[5]),
        stock: plainNumber(cells[6]),
        minStock: plainNumber(cells[7]),
        barcode: cells[8] || ""
      };
    }

    function parseProductText(text) {
      return String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
        const cells = splitRow(line);
        const fullRow = productFromCells(cells);
        if (fullRow) return fullRow;

        const match = line.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)$/);
        if (!match) return null;
        return {
          name: match[1].trim(),
          category: "Umum",
          unit: "pcs",
          unitContent: 1,
          basePrice: 0,
          salePrice: 0,
          stock: plainNumber(match[2]),
          minStock: 0,
          barcode: ""
        };
      }).filter((row) => row && row.name);
    }

    function parseShoppingText(text) {
      return String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
        const cells = splitRow(line);
        const name = cells.length >= 2 ? cells[0] : (line.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)$/)?.[1] || "");
        const qty = cells.length >= 2 ? plainNumber(cells[1]) : plainNumber(line.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)$/)?.[2]);
        if (!name || !qty) return null;
        const product = findProduct(name);
        const amount = product ? Number(product.basePrice || 0) : 0;
        return { id: Date.now() + Math.random(), name: name.trim(), qty, amount, subtotal: qty * amount };
      }).filter(Boolean);
    }

    async function importProducts(rows) {
      let saved = 0;
      for (const row of rows) {
        await gas("add", { collection: "products", item: row });
        saved += 1;
      }
      await load();
      alert(`${saved} barang berhasil diimport.`);
    }

    async function readProductFile(file) {
      const ext = file.name.split(".").pop().toLowerCase();
      if (["xlsx", "xls"].includes(ext)) {
        if (!window.XLSX) throw new Error("Library Excel belum termuat. Coba koneksi internet aktif atau gunakan CSV.");
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        const first = (rows[0] || []).map((cell) => String(cell).toLowerCase());
        const hasHeader = first.some((cell) => ["nama", "name", "barang", "harga dasar", "baseprice"].includes(cell));
        return (hasHeader ? rows.slice(1) : rows).map((row) => productFromCells(row.map(String))).filter((item) => item && item.name);
      }

      const text = await file.text();
      const lines = text.split(/\r?\n/).filter(Boolean);
      const first = splitRow(lines[0] || "").map((cell) => cell.toLowerCase());
      const hasHeader = first.some((cell) => ["nama", "name", "barang", "harga dasar", "baseprice"].includes(cell));
      return parseProductText((hasHeader ? lines.slice(1) : lines).join("\n"));
    }

    function dailySales() {
      const map = {};
      state.data.sales.forEach((sale) => map[sale.date] = (map[sale.date] || 0) + Number(sale.profit || 0));
      return Object.keys(map).sort().map((date) => ({ date, profit: map[date] }));
    }

    function superAdmins() {
      return state.data.users.filter((user) => user.role === "Super Admin");
    }

    function barChart(values) {
      const max = Math.max(...values.map(Number), 1);
      return `<div class="chart">${values.map((value) => `<div class="bar" title="${rupiah(value)}" style="height:${Math.max(Number(value) / max * 100, 5)}%"></div>`).join("")}</div>`;
    }

    function bindForms() {
      document.querySelectorAll("form[data-form]").forEach((form) => {
        form.onsubmit = async (event) => {
          event.preventDefault();
          try {
            const collection = form.dataset.form;
            const item = Object.fromEntries(new FormData(form).entries());
            const id = item.id;
            delete item.id;
            await gas(id ? "update" : "add", { collection, id, item });
            await load();
          } catch (error) {
            alert(error.message);
          }
        };
      });

      document.querySelectorAll("[data-edit]").forEach((button) => {
        button.onclick = () => {
          if (button.dataset.edit === "shopping") {
            fillShoppingForm(button.dataset.id);
            return;
          }
          fillForm(button.dataset.edit, button.dataset.id);
        };
      });

      document.querySelectorAll("[data-delete]").forEach((button) => {
        button.onclick = async () => {
          if (!confirm("Hapus data ini?")) return;
          if (button.dataset.delete === "shopping") {
            saveShoppingRows(shoppingRows().filter((row) => String(row.id) !== String(button.dataset.id)));
            render();
            return;
          }
          await gas("remove", { collection: button.dataset.delete, id: button.dataset.id });
          await load();
        };
      });

      bindProductTools();
      bindShoppingTools();
    }

    function bindProductTools() {
      el("parse-products-wa")?.addEventListener("click", async () => {
        try {
          const rows = parseProductText(el("product-wa-text").value);
          if (!rows.length) throw new Error("Tidak ada data barang yang bisa diproses.");
          await importProducts(rows);
        } catch (error) {
          alert(error.message);
        }
      });

      el("import-products-file")?.addEventListener("click", async () => {
        try {
          const file = el("product-import-file").files[0];
          if (!file) throw new Error("Pilih file CSV atau Excel terlebih dahulu.");
          const rows = await readProductFile(file);
          if (!rows.length) throw new Error("File tidak berisi data barang yang valid.");
          await importProducts(rows);
        } catch (error) {
          alert(error.message);
        }
      });

      el("save-scanned-product")?.addEventListener("click", async () => {
        try {
          const item = {
            barcode: el("scanner-result").value.trim(),
            name: el("scanner-product-name").value.trim() || el("scanner-result").value.trim(),
            category: el("scanner-product-category").value || "Umum",
            unit: el("scanner-unit").value,
            unitContent: plainNumber(el("scanner-unit-content").value) || 1,
            basePrice: plainNumber(el("scanner-base-price").value),
            salePrice: plainNumber(el("scanner-sale-price").value),
            stock: plainNumber(el("scanner-stock").value),
            minStock: 0
          };
          await gas("add", { collection: "products", item });
          await stopScanner();
          await load();
        } catch (error) {
          alert(error.message);
        }
      });

      el("start-product-scanner")?.addEventListener("click", startScanner);
      el("stop-product-scanner")?.addEventListener("click", stopScanner);
    }

    function bindShoppingTools() {
      const form = el("shopping-form");
      form?.addEventListener("submit", (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const id = formData.get("id") || Date.now() + Math.random();
        const name = formData.get("name").trim();
        const product = findProduct(name);
        const qty = plainNumber(formData.get("qty"));
        const amount = plainNumber(formData.get("amount")) || Number(product?.basePrice || 0);
        const next = { id, name, qty, amount, subtotal: qty * amount };
        const rows = shoppingRows();
        const exists = rows.some((row) => String(row.id) === String(id));
        saveShoppingRows(exists ? rows.map((row) => String(row.id) === String(id) ? next : row) : [next, ...rows]);
        render();
      });

      form?.elements.name?.addEventListener("input", () => {
        const product = findProduct(form.elements.name.value);
        if (product) form.elements.amount.value = product.basePrice;
      });

      el("parse-shopping-wa")?.addEventListener("click", () => {
        const rows = parseShoppingText(el("shopping-wa-text").value);
        if (!rows.length) {
          alert("Tidak ada daftar belanja yang bisa diproses.");
          return;
        }
        saveShoppingRows([...rows, ...shoppingRows()]);
        render();
      });

      el("clear-shopping")?.addEventListener("click", () => {
        if (!confirm("Kosongkan kalkulator belanja?")) return;
        saveShoppingRows([]);
        render();
      });
    }

    function fillForm(collection, id) {
      const form = document.querySelector(`form[data-form="${collection}"]`);
      const row = state.data[collection].find((item) => String(item.id) === String(id));
      if (!form || !row) return;
      Object.keys(row).forEach((key) => {
        if (form.elements[key]) form.elements[key].value = row[key];
      });
      if (form.elements.password) form.elements.password.value = "";
      scrollTo({ top: 0, behavior: "smooth" });
    }

    function fillShoppingForm(id) {
      const form = el("shopping-form");
      const row = shoppingRows().find((item) => String(item.id) === String(id));
      if (!form || !row) return;
      form.elements.id.value = row.id;
      form.elements.name.value = row.name;
      form.elements.qty.value = row.qty;
      form.elements.amount.value = row.amount;
      scrollTo({ top: 0, behavior: "smooth" });
    }

    async function startScanner() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Browser belum mendukung akses kamera.");
        }
        const video = el("scanner-video");
        scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = scannerStream;
        video.classList.remove("hidden");
        el("stop-product-scanner").classList.remove("hidden");
        await video.play();

        if (!("BarcodeDetector" in window)) {
          alert("Kamera aktif. Browser belum mendukung deteksi barcode otomatis, isi hasil scanner manual.");
          return;
        }

        const detector = new BarcodeDetector({ formats: ["qr_code", "ean_13", "ean_8", "code_128", "code_39", "upc_a", "upc_e"] });
        scannerActive = true;
        const scan = async () => {
          if (!scannerActive) return;
          try {
            const codes = await detector.detect(video);
            if (codes.length) {
              el("scanner-result").value = codes[0].rawValue;
              scannerActive = false;
              await stopScanner();
              return;
            }
          } catch (error) {
            console.warn(error);
          }
          requestAnimationFrame(scan);
        };
        scan();
      } catch (error) {
        alert(error.message);
      }
    }

    async function stopScanner() {
      scannerActive = false;
      if (scannerStream) {
        scannerStream.getTracks().forEach((track) => track.stop());
        scannerStream = null;
      }
      const video = el("scanner-video");
      if (video) {
        video.pause();
        video.srcObject = null;
        video.classList.add("hidden");
      }
      el("stop-product-scanner")?.classList.add("hidden");
    }

    el("super-login").onclick = () => {
      const admins = superAdmins();
      el("login-users").innerHTML = admins.map((user) => `<option value="${user.name}"></option>`).join("");
      el("login-name").value = "";
      el("login-password").value = "";
      el("show-create-account").classList.toggle("hidden", admins.length > 0);
      el("create-account-panel").classList.add("hidden");
      el("login-modal").classList.remove("hidden");
    };
    el("cancel-login").onclick = () => el("login-modal").classList.add("hidden");
    el("toggle-password").onclick = () => {
      const input = el("login-password");
      input.type = input.type === "password" ? "text" : "password";
    };
    el("show-create-account").onclick = () => {
      if (superAdmins().length > 0) {
        alert("Super Admin sudah terdaftar. Hanya boleh ada satu akun Super Admin.");
        return;
      }
      el("create-account-panel").classList.toggle("hidden");
    };
    el("submit-login").onclick = async () => {
      try {
        const user = await gas("login", { name: el("login-name").value.trim(), password: el("login-password").value });
        loginAs(user);
      } catch (error) {
        alert(error.message);
      }
    };
    el("submit-create-account").onclick = async () => {
      try {
        const item = {
          name: el("create-name").value.trim(),
          password: el("create-password").value,
          role: "Super Admin",
          status: "Aktif"
        };
        await gas("add", { collection: "users", item });
        await load();
        const user = await gas("login", { name: item.name, password: item.password });
        loginAs(user);
      } catch (error) {
        alert(error.message);
      }
    };
    el("logout-super").onclick = () => {
      state.role = "Admin";
      state.currentUser = null;
      localStorage.removeItem("role");
      localStorage.removeItem("currentUser");
      renderShell();
      render();
    };

    function loginAs(user) {
      state.role = user.role;
      state.currentUser = user;
      localStorage.setItem("role", state.role);
      localStorage.setItem("currentUser", JSON.stringify(user));
      el("login-modal").classList.add("hidden");
      renderShell();
      render();
    }

    setInterval(() => el("clock").textContent = new Date().toLocaleString("id-ID"), 1000);
    load().catch((error) => el("content").innerHTML = `<div class="card"><h2>Error</h2><p>${error.message}</p></div>`);
  </script>
</body>
</html>
