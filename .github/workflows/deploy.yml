name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: 76.13.16.24
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/inventory
            if [ ! -d ".git" ]; then
              git init
            fi
            # Use GITHUB_TOKEN to authenticate HTTPS pull
            git remote remove origin || true
            git remote add origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git config --global --add safe.directory /var/www/inventory
            git stash || true
            git fetch --all
            git reset --hard origin/main
            git pull origin main
            npm install --production
            
            pm2 restart inventory



