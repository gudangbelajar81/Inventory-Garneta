<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retail Inventory System</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --green: #16a34a;
      --mint: #bbf7d0;
      --orange: #f97316;
      --dark: #0f172a;
      --line: #dbe7dc;
      --page: #f7fbf6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--page); color: var(--dark); }
    button, input, select, textarea { font: inherit; }
    .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .sidebar { background: linear-gradient(160deg, var(--green), #22c55e 58%, var(--orange)); color: white; padding: 18px; }
    .brand { font-size: 20px; font-weight: 800; line-height: 1.2; margin-bottom: 18px; }
    .nav { display: grid; gap: 8px; }
    .nav button { border: 0; border-radius: 8px; padding: 11px 12px; cursor: pointer; text-align: left; color: white; background: rgba(255,255,255,.12); }
    .nav button.active, .nav button:hover { background: rgba(255,255,255,.28); }
    .main { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 18px; background: linear-gradient(90deg, #ffffff, #ecfdf5 55%, #fff7ed); border-bottom: 1px solid var(--line); }
    .content { padding: 18px; }
    .card { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: 0 12px 28px rgba(15,23,42,.06); }
    .grid { display: grid; gap: 14px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .forms { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn { border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; background: white; cursor: pointer; font-weight: 700; }
    .btn.primary { border: 0; color: white; background: linear-gradient(135deg, var(--green), var(--orange)); }
    .btn.danger { color: #c2410c; background: #fff7ed; border-color: #fed7aa; }
    .btn.soft { color: #15803d; background: #f0fdf4; border-color: #bbf7d0; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; }
    input, select, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 7px; padding: 9px 10px; background: white; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 14px; vertical-align: top; }
    th { background: #f8fafc; font-size: 12px; text-transform: uppercase; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
    .muted { color: #64748b; }
    .hidden { display: none !important; }
    .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15,23,42,.45); padding: 20px; z-index: 20; }
    .modal .card { max-width: 420px; width: 100%; }
    .chart { display: flex; align-items: end; gap: 8px; height: 180px; padding-top: 12px; }
    .bar { min-width: 24px; flex: 1; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, var(--orange), var(--green)); }
    textarea.input-area { min-height: 120px; resize: vertical; }
    video.scanner-preview { width: 100%; max-height: 240px; border-radius: 8px; border: 1px solid var(--line); background: #0f172a; object-fit: cover; }
    .settings-page { background: radial-gradient(circle at 20% 0%, rgba(34,211,238,.16), transparent 28%), #090a10; color: #f8fafc; border-radius: 8px; padding: 22px; min-height: calc(100vh - 118px); }
    .settings-hero, .api-center-card, .api-help-card { background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); border: 1px solid rgba(148,163,184,.18); border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.32); }
    .settings-hero { padding: 22px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .settings-kicker { color: #67e8f9; font-size: 11px; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; }
    .settings-title { margin: 8px 0 4px; font-size: 24px; font-weight: 900; }
    .settings-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    .settings-tabs button { border: 1px solid rgba(148,163,184,.24); border-radius: 999px; padding: 10px 22px; background: rgba(255,255,255,.05); color: #dbeafe; font-weight: 900; cursor: pointer; }
    .settings-tabs button.active { background: linear-gradient(135deg, #2563eb, #7c3aed); border-color: transparent; color: white; }
    .api-center-card { max-width: 560px; padding: 20px; display: grid; gap: 16px; }
    .api-section-title { color: #facc15; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; }
    .api-badges { display: flex; flex-wrap: wrap; gap: 10px; }
    .api-badge { border: 1px solid rgba(148,163,184,.22); border-radius: 999px; padding: 9px 13px; background: rgba(2,6,23,.68); color: #e2e8f0; font-size: 12px; font-weight: 900; }
    .api-badge.ok { border-color: rgba(16,185,129,.55); color: #99f6e4; }
    .api-badge.warn { border-color: rgba(245,158,11,.65); color: #fde68a; }
    .api-key-box { display: grid; gap: 8px; }
    .api-key-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .api-key-display { border: 1px solid rgba(148,163,184,.22); border-radius: 14px; background: #090a10; padding: 13px 14px; color: #cbd5e1; font-weight: 900; overflow-wrap: anywhere; }
    .api-form-grid { display: grid; gap: 12px; }
    .api-form-grid select, .api-form-grid input, .api-form-grid textarea { width: 100%; border: 1px solid rgba(148,163,184,.24); border-radius: 14px; background: #090a10; color: #f8fafc; padding: 13px 14px; outline: none; }
    .api-form-grid textarea { min-height: 132px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    #ai-api-keys[data-hidden="true"] { -webkit-text-security: disc; }
    .api-form-grid option { color: #0f172a; }
    .api-key-list { display: grid; gap: 8px; }
    .api-key-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid rgba(148,163,184,.18); border-radius: 14px; background: rgba(2,6,23,.62); padding: 10px 12px; color: #cbd5e1; font-size: 12px; }
    .api-key-item strong { color: #f8fafc; }
    .api-key-display-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
    .api-edit-overlay { grid-column: 1 / -1; width: 100%; margin-top: 10px; grid-template-columns: 1fr auto auto; gap: 8px; padding: 12px; border-radius: 14px; border: 1px solid rgba(34,211,238,.24); background: rgba(2,6,23,.9); box-shadow: inset 0 0 0 1px rgba(255,255,255,.03); }
    .api-edit-overlay input { border: 1px solid rgba(148,163,184,.24); border-radius: 12px; background: #090a10; color: #f8fafc; padding: 10px 12px; }
    .api-key-input-list { display: grid; gap: 8px; }
    .api-key-input-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
    .api-primary { border: 0; border-radius: 14px; padding: 13px 18px; color: white; font-weight: 900; background: linear-gradient(135deg, #7c3aed, #2563eb); cursor: pointer; }
    .api-warning { border: 1px solid rgba(245,158,11,.55); background: rgba(120,53,15,.36); color: #fde68a; border-radius: 14px; padding: 13px 14px; font-size: 13px; }
    .api-help-card { padding: 16px; color: #cbd5e1; }
    .api-help-card ol { margin: 10px 0 0; padding-left: 20px; line-height: 1.75; }
    .api-status-text { color: #a7f3d0; font-weight: 800; }
    .theme-panel { max-width: 560px; margin-top: 16px; padding: 20px; display: grid; gap: 14px; background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); border: 1px solid rgba(148,163,184,.18); border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.24); }
    .theme-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .theme-grid label { color: #e2e8f0; }
    .theme-grid input[type="color"] { height: 44px; padding: 4px; background: #090a10; border-color: rgba(148,163,184,.24); cursor: pointer; }
    .theme-preview { height: 52px; border: 1px solid rgba(148,163,184,.2); border-radius: 14px; background: linear-gradient(135deg, var(--green), var(--orange)); }
    .edit-overlay { display: none; }
    .edit-overlay.active { display: grid; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: sticky; top: 0; z-index: 6; }
      .nav { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .stats, .forms { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Retail Inventory<br>Web Server</div>
      <div class="nav" id="nav"></div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div>
          <strong id="page-title">Dashboard</strong>
          <div class="muted" id="clock"></div>
        </div>
        <div class="actions">
          <span id="role-label" class="muted">Admin</span>
          <button class="btn soft" id="super-login">Super Admin</button>
          <button class="btn danger hidden" id="logout-super">Keluar Super Admin</button>
        </div>
      </div>
      <div class="content" id="content">Memuat data...</div>
    </main>
  </div>

  <div class="modal hidden" id="login-modal">
    <div class="card grid">
      <h3>Masuk Super Admin</h3>
      <label>Nama Super Admin<input id="login-name" list="login-users" autocomplete="username" placeholder="Masukkan nama Super Admin"></label>
      <datalist id="login-users"></datalist>
      <label>Password
        <div style="display:grid;grid-template-columns:1fr auto;gap:8px">
          <input id="login-password" type="password">
          <button class="btn" id="toggle-password">Lihat</button>
        </div>
      </label>
      <div class="actions" style="justify-content:flex-end">
        <button class="btn soft" id="show-create-account">Buat Super Admin</button>
        <button class="btn" id="cancel-login">Batal</button>
        <button class="btn primary" id="submit-login">Masuk</button>
      </div>
      <div id="create-account-panel" class="hidden grid" style="border-top:1px solid var(--line);padding-top:12px">
        <h3>Buat Super Admin</h3>
        <label>Nama Super Admin<input id="create-name" autocomplete="username"></label>
        <label>Password<input id="create-password" type="password" autocomplete="new-password"></label>
        <p class="muted">Hanya boleh ada satu akun Super Admin. Admin biasa tidak perlu login atau daftar akun.</p>
        <div class="actions" style="justify-content:flex-end">
          <button class="btn primary" id="submit-create-account">Simpan Akun</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const menus = [
      ["dashboard", "Dashboard"], ["barang", "Barang"], ["supplier", "Supplier"],
      ["pembelian", "Pembelian"], ["kalkulator", "Kalkulator Belanja"], ["penjualan", "Penjualan"], ["laporan", "Laporan"],
      ["statistik", "Statistik"], ["users", "Users"], ["settings", "Setting"]
    ];

    const state = {
      route: "dashboard",
      role: localStorage.getItem("role") || "Admin",
      currentUser: JSON.parse(localStorage.getItem("currentUser") || "null"),
      data: { products: [], suppliers: [], purchases: [], sales: [], users: [], priceHistory: [], dashboard: {} }
    };
    let scannerStream = null;
    let scannerActive = false;
    let invoiceStream = null;

    const rupiah = (value) => new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(Number(value || 0));
    const today = () => new Date().toISOString().slice(0, 10);
    const el = (id) => document.getElementById(id);
    const API_URL = window.location.protocol === "file:" ? "http://127.0.0.1:3000/api" : "/api";

    async function gas(action, payload = {}) {
      let response;
      try {
        response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, payload })
        });
      } catch (error) {
        throw new Error("Tidak bisa terhubung ke server. Buka http://127.0.0.1:3000/ atau pastikan node server.js sedang berjalan.");
      }

      const text = await response.text();
      const result = text ? JSON.parse(text) : null;

      if (!response.ok) {
        throw new Error(result?.message || result?.error || `API ${response.status}`);
      }

      return result?.data !== undefined ? result.data : result;
    }

    async function load() {
      state.data = await gas("bootstrap");
      renderShell();
      render();
    }

    function renderShell() {
      el("nav").innerHTML = menus.map(([key, label]) => `<button data-route="${key}" class="${state.route === key ? "active" : ""}">${label}</button>`).join("");
      el("nav").querySelectorAll("button").forEach((button) => {
        button.onclick = () => {
          state.route = button.dataset.route;
          renderShell();
          render();
        };
      });
      const superMode = state.role === "Super Admin";
      el("role-label").textContent = superMode ? `Super Admin: ${state.currentUser?.name || ""}` : "Admin";
      el("super-login").classList.toggle("hidden", superMode);
      el("logout-super").classList.toggle("hidden", !superMode);
    }

    function render() {
      const label = menus.find(([key]) => key === state.route)?.[1] || "Dashboard";
      el("page-title").textContent = label;
      if (["laporan", "statistik", "users"].includes(state.route) && state.role !== "Super Admin") {
        el("content").innerHTML = `<div class="card"><h2>Akses dibatasi</h2><p class="muted">Menu ini hanya bisa diakses Super Admin.</p></div>`;
        return;
      }
      const views = { dashboard, barang, supplier, pembelian, kalkulator, penjualan, laporan, statistik, users, settings };
      el("content").innerHTML = views[state.route]();
      bindForms();
    }

    function dashboard() {
      const d = state.data.dashboard || {};
      return `<section class="grid">
        <div class="grid stats">
          ${stat("Barang", d.totalProducts)}
          ${stat("Supplier", d.totalSuppliers)}
          ${stat("Nilai Stok", rupiah(d.stockValue))}
          ${stat("Keuntungan", rupiah(d.totalProfit))}
        </div>
        <div class="card"><h3>AI Nota ke Barang</h3>${invoiceAiTools()}</div>
        <div class="card"><h3>Stok Menipis</h3>${simpleTable(d.stockAlerts || [], ["name", "stock", "minStock"], ["Barang", "Stok", "Minimal"])}</div>
      </section>`;
    }

    function invoiceAiTools() {
      return `<div class="grid">
        <div class="grid forms">
          <label>Import Foto Nota JPG/JPEG/PNG
            <input id="invoice-image-file" type="file" accept="image/jpeg,image/jpg,image/png">
          </label>
          <div class="actions" style="align-self:end">
            <button class="btn soft" id="open-invoice-camera">Buka Kamera</button>
            <button class="btn danger hidden" id="close-invoice-camera">Tutup Kamera</button>
          </div>
        </div>
        <video id="invoice-camera-video" class="scanner-preview hidden" playsinline></video>
        <canvas id="invoice-canvas" class="hidden"></canvas>
        <div class="actions">
          <button class="btn primary" id="analyze-invoice-file">Analisa Foto</button>
          <button class="btn primary hidden" id="capture-invoice-photo">Foto & Analisa</button>
          <button class="btn soft" id="save-invoice-products">Masukkan ke Barang</button>
        </div>
        <label>Hasil JSON AI
          <textarea id="invoice-ai-result" class="input-area" placeholder='{"tanggal":"04/06/26","items":[],"total_belanja":0}'></textarea>
        </label>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Nama Barang</th><th>Kuantitas</th><th>Harga Modal</th><th>Tipe Harga</th><th>Aksi</th></tr>
            </thead>
            <tbody id="invoice-table-body">
              <tr><td colspan="5" class="muted">Belum ada hasil analisa.</td></tr>
            </tbody>
          </table>
        </div>
        <p class="muted">Butuh env AI_PROVIDER dan AI_API_KEY di Railway. Hasil AI mengikuti format JSON DSI dan dapat langsung dimasukkan ke menu Barang.</p>
      </div>`;
    }

    function barang() {
      return `<section class="grid">
        <div class="card"><h2>Barang</h2>${productForm()}</div>
        <div class="card"><h3>Import Barang</h3>${productImportTools()}</div>
        <div class="card"><h3>Scanner HP</h3>${productScannerTools()}</div>
        <div class="card"><h3>Daftar Barang</h3>${productRows()}</div>
      </section>`;
    }

    function supplier() {
      return crudView("suppliers", "Supplier", supplierForm(), supplierRows());
    }

    function pembelian() {
      return crudView("purchases", "Pembelian", purchaseForm(), purchaseRows());
    }

    function kalkulator() {
      const rows = shoppingRows();
      const total = rows.reduce((sum, row) => sum + shoppingSubtotal(row), 0);
      return `<section class="grid">
        <div class="card">
          <h2>Kalkulator Belanja</h2>
          <form id="shopping-form" class="grid forms">
            ${hiddenId()}
            <label>Nama Barang<input name="name" list="shopping-products" required placeholder="Contoh: Beras Premium"></label>
            <datalist id="shopping-products">${state.data.products.map((p) => `<option value="${p.name}"></option>`).join("")}</datalist>
            ${input("qty", "Banyak Beli", true, "number")}
            ${input("amount", "Harga Dasar", false, "number")}
            ${formButtons()}
          </form>
        </div>
        <div class="card">
          <h3>Copy Paste dari WA</h3>
          <label>Daftar Belanja
            <textarea id="shopping-wa-text" class="input-area" placeholder="Contoh:
Payung 5
Gula Pasir 2
Beras Premium 1"></textarea>
          </label>
          <div class="actions">
            <button class="btn soft" id="parse-shopping-wa">Proses Paste WA</button>
            <button class="btn danger" id="clear-shopping">Kosongkan</button>
          </div>
        </div>
        <div class="card">
          <div class="actions" style="justify-content:space-between">
            <h3>Daftar Belanja</h3>
            <h2>${rupiah(total)}</h2>
          </div>
          ${shoppingTable(rows)}
        </div>
      </section>`;
    }

    function penjualan() {
      return crudView("sales", "Input Penjualan", saleForm(), saleRows());
    }

    function laporan() {
      const rows = dailySales();
      return `<section class="grid">
        <div class="card"><h2>Laporan Penjualan Harian</h2>${simpleTable(rows, ["date", "profit"], ["Tanggal", "Keuntungan"])}</div>
        <div class="card"><h2>Grafik Keuntungan</h2>${barChart(rows.map((row) => row.profit))}</div>
      </section>`;
    }

    function statistik() {
      return `<section class="grid">
        <div class="card"><h2>Statistik Perubahan Harga</h2>${barChart(state.data.priceHistory.map((row) => row.basePrice))}</div>
        <div class="card">${simpleTable(state.data.priceHistory, ["product", "basePrice", "costPrice", "source", "createdAt"], ["Barang", "Harga Dasar", "HPP", "Sumber", "Tanggal"], priceFormat)}</div>
      </section>`;
    }

    function users() {
      return crudView("users", "Akun Super Admin", userForm(), userRows());
    }

    function settings() {
      return `<section class="settings-page">
        <div class="settings-hero">
          <div>
            <div class="settings-kicker">Settings</div>
            <div class="settings-title">Pusat API (Load Balancer)</div>
            <p class="muted">Kelola koneksi AI dari server Railway. Key tetap tersembunyi dan hanya dipakai backend.</p>
          </div>
          <button class="api-primary" id="refresh-ai-settings">RECHECK</button>
        </div>

        <div class="settings-tabs">
          <button>SUPPORT</button>
          <button>ENGINE</button>
          <button class="active">PUSAT API</button>
        </div>

        <div class="api-center-card">
          <div class="api-section-title">API Keys</div>
          <div id="ai-settings-panel" class="grid">
            <p class="muted">Memuat pengaturan API...</p>
          </div>
          <button class="api-primary" id="test-ai-settings">HEALTH CHECK NOW</button>
          <p id="ai-settings-test-result" class="api-status-text"></p>

          <div class="api-help-card">
            <strong>CARA SET API KEY</strong>
            <ol>
              <li>Pilih provider AI: Gemini, OpenAI, atau Groq.</li>
              <li>Masukkan sampai 10 API key, satu baris satu key.</li>
              <li>Klik Save API Settings, lalu Health Check Now.</li>
              <li>Sistem memprioritaskan key LIVE dan memindahkan key 429 ke DEAD.</li>
            </ol>
          </div>
        </div>
        <div class="theme-panel">
          <div class="api-section-title">Warna Tampilan</div>
          <div class="theme-preview" id="theme-preview"></div>
          <div class="theme-grid">
            <label>Hijau Utama<input id="theme-green" type="color"></label>
            <label>Orange Aksen<input id="theme-orange" type="color"></label>
            <label>Background<input id="theme-page" type="color"></label>
          </div>
          <div class="actions">
            <button class="api-primary" id="save-theme-colors" type="button">SIMPAN WARNA</button>
            <button class="btn soft" id="reset-theme-colors" type="button">RESET</button>
          </div>
          <p class="muted">Warna berlaku untuk dashboard, sidebar, topbar, tombol utama, grafik, dan halaman lain.</p>
        </div>
      </section>`;
    }

    function crudView(collection, title, form, rows) {
      return `<section class="grid">
        <div class="card"><h2>${title}</h2>${form}</div>
        <div class="card"><h3>Daftar ${title}</h3>${rows}</div>
      </section>`;
    }

    function stat(label, value) {
      return `<div class="card"><div class="muted">${label}</div><h2>${value ?? 0}</h2></div>`;
    }

    function productForm() {
      return `<form data-form="products" class="grid forms">
        ${hiddenId()}
        ${input("category", "Kategori Barang")}
        ${input("name", "Nama Barang", true)}
        ${select("unit", "Unit", ["sak", "karton/dus", "jligen", "pcs"])}
        ${input("unitContent", "Isi/Unit", true, "number")}
        ${input("basePrice", "Harga Dasar", true, "number")}
        ${input("salePrice", "Harga Jual/Unit", true, "number")}
        ${input("stock", "Stok", false, "number")}
        ${input("minStock", "Stok Minimal", false, "number")}
        ${input("barcode", "Barcode / Kode Scanner")}
        ${formButtons()}
      </form>`;
    }

    function productImportTools() {
      return `<div class="grid">
        <div class="grid forms">
          <label>File CSV / Excel / Spreadsheet

    function priceFormat(key, value) {
      return ["basePrice", "costPrice", "salePrice", "amount", "total", "profitPerUnit", "profit"].includes(key) ? rupiah(value) : value;
    }

    function findProduct(name) {
      return state.data.products.find((product) => product.name.toLowerCase() === String(name || "").trim().toLowerCase());
    }

    function plainNumber(value) {
      const cleaned = String(value ?? "").replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", ".");
      const parsed = Number(cleaned);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function splitRow(line) {
      return String(line).split(/[,;\t]/).map((cell) => cell.trim()).filter((cell) => cell !== "");
    }

    function productFromCells(cells) {
      if (cells.length <= 1) return null;
      return {
        name: cells[0],
        category: cells[1] || "Umum",
        unit: cells[2] || "pcs",
        unitContent: plainNumber(cells[3]) || 1,
        basePrice: plainNumber(cells[4]),
        salePrice: plainNumber(cells[5]),
        stock: plainNumber(cells[6]),
        minStock: plainNumber(cells[7]),
        barcode: cells[8] || ""
      };
    }

    function parseProductText(text) {
      return String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
        const cells = splitRow(line);
        const fullRow = productFromCells(cells);
        if (fullRow) return fullRow;

        const match = line.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)$/);
        if (!match) return null;
        return {
          name: match[1].trim(),
          category: "Umum",
          unit: "pcs",
          unitContent: 1,
          basePrice: 0,
          salePrice: 0,
          stock: plainNumber(match[2]),
          minStock: 0,
          barcode: ""
        };
      }).filter((row) => row && row.name);
    }

    function parseShoppingText(text) {
      return String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
        const cells = splitRow(line);
        const name = cells.length >= 2 ? cells[0] : (line.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)$/)?.[1] || "");
        const qty = cells.length >= 2 ? plainNumber(cells[1]) : plainNumber(line.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)$/)?.[2]);
        if (!name || !qty) return null;
        const product = findProduct(name);
        const amount = product ? Number(product.basePrice || 0) : 0;
        return { id: Date.now() + Math.random(), name: name.trim(), qty, amount, subtotal: qty * amount };
      }).filter(Boolean);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Gagal membaca file gambar."));
        reader.readAsDataURL(file);
      });
    }

    async function readProductFile(file) {
      const ext = file.name.split(".").pop().toLowerCase();
      if (["xlsx", "xls"].includes(ext)) {
        if (!window.XLSX) throw new Error("Library Excel belum termuat. Coba koneksi internet aktif atau gunakan CSV.");
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        const first = (rows[0] || []).map((cell) => String(cell).toLowerCase());
        const hasHeader = first.some((cell) => ["nama", "name", "barang", "harga dasar", "baseprice"].includes(cell));
        return (hasHeader ? rows.slice(1) : rows).map((row) => productFromCells(row.map(String))).filter((item) => item && item.name);
      }

      const text = await file.text();
      const lines = text.split(/\r?\n/).filter(Boolean);
      const first = splitRow(lines[0] || "").map((cell) => cell.toLowerCase());
      const hasHeader = first.some((cell) => ["nama", "name", "barang", "harga dasar", "baseprice"].includes(cell));
      return parseProductText((hasHeader ? lines.slice(1) : lines).join("\n"));
    }

    const defaultTheme = { green: "#16a34a", orange: "#f97316", page: "#f7fbf6" };

    function currentTheme() {
      try {
        return { ...defaultTheme, ...JSON.parse(localStorage.getItem("themeColors") || "{}") };
      } catch (error) {
        return { ...defaultTheme };
      }
    }

    function applyTheme(theme = currentTheme()) {
      const root = document.documentElement;
      root.style.setProperty("--green", theme.green);
      root.style.setProperty("--orange", theme.orange);
      root.style.setProperty("--page", theme.page);
      root.style.setProperty("--mint", softenColor(theme.green, "#bbf7d0"));
      root.style.setProperty("--line", softenColor(theme.green, "#dbe7dc"));
    }

    function bindThemeTools() {
      if (!el("theme-green")) return;
      const theme = currentTheme();
      el("theme-green").value = theme.green;
      el("theme-orange").value = theme.orange;
      el("theme-page").value = theme.page;
      updateThemePreview();

      ["theme-green", "theme-orange", "theme-page"].forEach((id) => {
        el(id)?.addEventListener("input", () => {
          const next = readThemeInputs();
          applyTheme(next);
          updateThemePreview();
        });
      });

      el("save-theme-colors")?.addEventListener("click", () => {
        const next = readThemeInputs();
        localStorage.setItem("themeColors", JSON.stringify(next));
        applyTheme(next);
      });

      el("reset-theme-colors")?.addEventListener("click", () => {
        localStorage.removeItem("themeColors");
        applyTheme(defaultTheme);
        el("theme-green").value = defaultTheme.green;
        el("theme-orange").value = defaultTheme.orange;
        el("theme-page").value = defaultTheme.page;
        updateThemePreview();
      });
    }

    function readThemeInputs() {
      return {
        green: el("theme-green")?.value || defaultTheme.green,
        orange: el("theme-orange")?.value || defaultTheme.orange,
        page: el("theme-page")?.value || defaultTheme.page
      };
    }

    function updateThemePreview() {
      const preview = el("theme-preview");
      if (!preview) return;
      const theme = readThemeInputs();
      preview.style.background = `linear-gradient(135deg, ${theme.green}, ${theme.orange})`;
    }

    function softenColor(value, fallback) {
      const hex = String(value || "").replace("#", "");
      if (!/^[0-9a-f]{6}$/i.test(hex)) return fallback;
      const r = parseInt(hex.slice(0, 2), 16);
      const g = parseInt(hex.slice(2, 4), 16);
      const b = parseInt(hex.slice(4, 6), 16);
      const mix = (channel) => Math.round(channel + (255 - channel) * 0.75).toString(16).padStart(2, "0");
      return `#${mix(r)}${mix(g)}${mix(b)}`;
    }

      toggle?.addEventListener("click", () => {
        const inputs = [...document.querySelectorAll(".ai-key-input")];
        const visible = inputs.some((input) => input.dataset.hidden !== "true");
        inputs.forEach((input) => {
          input.dataset.hidden = visible ? "true" : "false";
          input.type = visible ? "password" : "text";
        });
        toggle.textContent = visible ? "SHOW" : "HIDE";
      });

      addButton?.addEventListener("click", () => addAiKeyInput());
      form?.addEventListener("submit", saveAiSettings);
    }

    function renderAiKeyInputs(values) {
      const container = el("ai-key-input-list");
      if (!container) return;
      container.innerHTML = "";
      const safeValues = (values || [""]).slice(0, 10);
      safeValues.forEach((value) => addAiKeyInput(value));
    }

    function addAiKeyInput(value = "") {
      const container = el("ai-key-input-list");
      if (!container || container.children.length >= 10) return;
      const row = document.createElement("div");
      row.className = "api-key-input-row";
      row.innerHTML = `
        <input class="ai-key-input" data-hidden="true" type="password" value="${escapeAttr(value)}" placeholder="Masukkan API Key...">
        <span class="api-badge warn">PENDING</span>
        <button class="btn soft remove-ai-key" type="button">HAPUS</button>
      `;
      row.querySelector(".remove-ai-key").addEventListener("click", () => {
        row.remove();
        if (!container.children.length) addAiKeyInput();
      });
      container.appendChild(row);
    }

    function collectAiKeyValues() {
      return [...document.querySelectorAll(".ai-key-input")]
        .map((input) => input.value.trim())
        .filter(Boolean)
        .slice(0, 10);
    }

    async function saveAiSettings(event) {
      event.preventDefault();
      const target = el("ai-settings-test-result");
      try {
        target.textContent = "Menyimpan API settings...";
        await gas("saveAiSettings", {
          provider: el("ai-provider").value,
          model: el("ai-model").value,
          apiKeys: collectAiKeyValues()
        });
        target.textContent = "API settings berhasil disimpan.";
        await loadAiSettings();
      } catch (error) {
        target.textContent = error.message;
      }
    }

    async function testAiSettings() {
      const target = el("ai-settings-test-result");
      try {
        target.textContent = "Menguji koneksi API...";
        const result = await gas("testAiSettings", {
          provider: el("ai-provider")?.value
        });
        const dead = (result.keys || []).filter((key) => key.status === "dead").length;
        target.textContent = `${result.message} Provider: ${result.provider}, Model: ${result.model}, Dead: ${dead}`;
        await loadAiSettings();
      } catch (error) {
        target.textContent = error.message === "API_KEY_NOT_CONFIGURED_ON_RAILWAY"
          ? "API key belum diatur. Isi dari halaman Pusat API lalu simpan."
          : error.message;
      }
    }

    function bindInvoiceAiTools() {
      el("analyze-invoice-file")?.addEventListener("click", async () => {
        try {
          const file = el("invoice-image-file").files[0];
          if (!file) throw new Error("Pilih file foto nota terlebih dahulu.");
          const imageDataUrl = await readFileAsDataUrl(file);
          await analyzeInvoiceImage(imageDataUrl);
        } catch (error) {
          alert(error.message);
        }
      });

      el("open-invoice-camera")?.addEventListener("click", openInvoiceCamera);
      el("close-invoice-camera")?.addEventListener("click", closeInvoiceCamera);
      el("capture-invoice-photo")?.addEventListener("click", async () => {
        try {
          const imageDataUrl = captureInvoiceFrame();
          await analyzeInvoiceImage(imageDataUrl);
        } catch (error) {
          alert(error.message);
        }
      });

      el("save-invoice-products")?.addEventListener("click", async () => {
        try {
          const invoice = collectInvoiceTableJson();
          const rows = invoiceItemsToProducts(invoice);
          if (!rows.length) throw new Error("Tidak ada item valid untuk dimasukkan ke Barang.");
          await importProducts(rows);
        } catch (error) {
          alert(error.message);
        }
      });
    }

    async function analyzeInvoiceImage(imageDataUrl) {
      el("invoice-ai-result").value = "Menganalisa foto nota...";
      renderTableFromJson({ items: [] });
      const result = await gas("analyzeInvoiceImage", { imageDataUrl });
      el("invoice-ai-result").value = JSON.stringify(result, null, 2);
      renderTableFromJson(result);
    }

    function renderTableFromJson(jsonData) {
      const tableBody = el("invoice-table-body");
      if (!tableBody) return;
      const items = Array.isArray(jsonData?.items) ? jsonData.items : [];
      tableBody.innerHTML = "";

      if (!items.length) {
        tableBody.innerHTML = `<tr><td colspan="5" class="muted">${jsonData?.error || "Belum ada item valid."}</td></tr>`;
        return;
      }

      items.forEach((item) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><input class="invoice-item-name" value="${escapeAttr(item.nama_barang || "")}"></td>
          <td><input class="invoice-item-qty" type="number" min="0" step="0.01" value="${Number(item.kuantitas || 0)}"></td>
          <td><input class="invoice-item-price" type="number" min="0" step="1" value="${Number(item.harga_modal || 0)}"></td>
          <td>
            <select class="invoice-item-type">
              <option value="H.M/pcs" ${item.tipe_harga === "H.M/pcs" ? "selected" : ""}>H.M/pcs</option>
              <option value="H.M/dus" ${item.tipe_harga === "H.M/dus" ? "selected" : ""}>H.M/dus</option>
              <option value="sst" ${item.tipe_harga === "sst" ? "selected" : ""}>sst</option>
            </select>
          </td>
          <td><button class="btn danger delete-invoice-row" type="button">Hapus</button></td>
        `;
        row.querySelector(".delete-invoice-row").addEventListener("click", () => {
          row.remove();
          syncInvoiceJsonFromTable();
        });
        row.querySelectorAll("input,select").forEach((input) => {
          input.addEventListener("input", syncInvoiceJsonFromTable);
          input.addEventListener("change", syncInvoiceJsonFromTable);
        });
        tableBody.appendChild(row);
      });

      syncInvoiceJsonFromTable();
    }

    function collectInvoiceTableJson() {
      const rows = [...document.querySelectorAll("#invoice-table-body tr")];
      const items = rows.map((row) => {
        const name = row.querySelector(".invoice-item-name")?.value.trim();
        if (!name) return null;
        return {
          nama_barang: name,
          kuantitas: Number(row.querySelector(".invoice-item-qty")?.value || 0),
          harga_modal: Number(row.querySelector(".invoice-item-price")?.value || 0),
          tipe_harga: row.querySelector(".invoice-item-type")?.value || "H.M/pcs"
        };
      }).filter(Boolean);

      let current = {};
      try {
        current = JSON.parse(el("invoice-ai-result")?.value || "{}");
      } catch (error) {
        current = {};
      }

      return {
        tanggal: current.tanggal || new Date().toLocaleDateString("id-ID", { day: "2-digit", month: "2-digit", year: "2-digit" }),
        items,
        total_belanja: items.reduce((sum, item) => sum + (Number(item.kuantitas || 0) * Number(item.harga_modal || 0)), 0),
        status: current.status || "review_required"
      };
    }

    function syncInvoiceJsonFromTable() {
      const output = el("invoice-ai-result");
      if (!output) return;
      output.value = JSON.stringify(collectInvoiceTableJson(), null, 2);
    }

    async function openInvoiceCamera() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error("Browser belum mendukung akses kamera.");
        const video = el("invoice-camera-video");
        invoiceStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = invoiceStream;
        video.classList.remove("hidden");
        el("capture-invoice-photo").classList.remove("hidden");
        el("close-invoice-camera").classList.remove("hidden");
        await video.play();
      } catch (error) {
        alert(error.message);
      }
    }

    function captureInvoiceFrame() {
      const video = el("invoice-camera-video");
      const canvas = el("invoice-canvas");
      if (!video?.videoWidth) throw new Error("Kamera belum siap.");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", 0.92);
    }

    function closeInvoiceCamera() {
      if (invoiceStream) {
        invoiceStream.getTracks().forEach((track) => track.stop());
        invoiceStream = null;
      }
      const video = el("invoice-camera-video");
      if (video) {
        video.pause();
        video.srcObject = null;
        video.classList.add("hidden");
      }
      el("capture-invoice-photo")?.classList.add("hidden");
      el("close-invoice-camera")?.classList.add("hidden");
    }

    function bindProductTools() {
      el("parse-products-wa")?.addEventListener("click", async () => {
        try {
          const rows = parseProductText(el("product-wa-text").value);
          if (!rows.length) throw new Error("Tidak ada data barang yang bisa diproses.");
          await importProducts(rows);
        } catch (error) {
          alert(error.message);
        }
      });

      el("import-products-file")?.addEventListener("click", async () => {
        try {
          const file = el("product-import-file").files[0];
          if (!file) throw new Error("Pilih file CSV atau Excel terlebih dahulu.");
          const rows = await readProductFile(file);
          if (!rows.length) throw new Error("File tidak berisi data barang yang valid.");
          await importProducts(rows);
        } catch (error) {
          alert(error.message);
        }
      });

      el("save-scanned-product")?.addEventListener("click", async () => {
        try {
          const item = {
            barcode: el("scanner-result").value.trim(),
            name: el("scanner-product-name").value.trim() || el("scanner-result").value.trim(),
            category: el("scanner-product-category").value || "Umum",
            unit: el("scanner-unit").value,
            unitContent: plainNumber(el("scanner-unit-content").value) || 1,
            basePrice: plainNumber(el("scanner-base-price").value),
            salePrice: plainNumber(el("scanner-sale-price").value),
            stock: plainNumber(el("scanner-stock").value),
            minStock: 0
          };
          await gas("add", { collection: "products", item });
          await stopScanner();
          await load();
        } catch (error) {
          alert(error.message);
        }
      });

      el("start-product-scanner")?.addEventListener("click", startScanner);
      el("stop-product-scanner")?.addEventListener("click", stopScanner);
    }

    function bindShoppingTools() {
      const form = el("shopping-form");
      form?.addEventListener("submit", (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const id = formData.get("id") || Date.now() + Math.random();
        const name = formData.get("name").trim();
        const product = findProduct(name);
        const qty = plainNumber(formData.get("qty"));
        const amount = plainNumber(formData.get("amount")) || Number(product?.basePrice || 0);
        const next = { id, name, qty, amount, subtotal: qty * amount };
        const rows = shoppingRows();
        const exists = rows.some((row) => String(row.id) === String(id));
        saveShoppingRows(exists ? rows.map((row) => String(row.id) === String(id) ? next : row) : [next, ...rows]);
        render();
      });

      form?.elements.name?.addEventListener("input", () => {
        const product = findProduct(form.elements.name.value);
        if (product) form.elements.amount.value = product.basePrice;
      });

      el("parse-shopping-wa")?.addEventListener("click", () => {
        const rows = parseShoppingText(el("shopping-wa-text").value);
        if (!rows.length) {
          alert("Tidak ada daftar belanja yang bisa diproses.");
          return;
        }
        saveShoppingRows([...rows, ...shoppingRows()]);
        render();
      });

      el("clear-shopping")?.addEventListener("click", () => {
        if (!confirm("Kosongkan kalkulator belanja?")) return;
        saveShoppingRows([]);
        render();
      });
    }

    function fillForm(collection, id) {
      const form = document.querySelector(`form[data-form="${collection}"]`);
      const row = state.data[collection].find((item) => String(item.id) === String(id));
      if (!form || !row) return;
      Object.keys(row).forEach((key) => {
        if (form.elements[key]) form.elements[key].value = row[key];
      });
      if (form.elements.password) form.elements.password.value = "";
      scrollTo({ top: 0, behavior: "smooth" });
    }

    function fillShoppingForm(id) {
      const form = el("shopping-form");
      const row = shoppingRows().find((item) => String(item.id) === String(id));
      if (!form || !row) return;
      form.elements.id.value = row.id;
      form.elements.name.value = row.name;
      form.elements.qty.value = row.qty;
      form.elements.amount.value = row.amount;
      scrollTo({ top: 0, behavior: "smooth" });
    }

    async function startScanner() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Browser belum mendukung akses kamera.");
        }
        const video = el("scanner-video");
        scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = scannerStream;
        video.classList.remove("hidden");
        el("stop-product-scanner").classList.remove("hidden");
        await video.play();

        if (!("BarcodeDetector" in window)) {
          alert("Kamera aktif. Browser belum mendukung deteksi barcode otomatis, isi hasil scanner manual.");
          return;
        }

        const detector = new BarcodeDetector({ formats: ["qr_code", "ean_13", "ean_8", "code_128", "code_39", "upc_a", "upc_e"] });
        scannerActive = true;
        const scan = async () => {
          if (!scannerActive) return;
          try {
            const codes = await detector.detect(video);
            if (codes.length) {
              el("scanner-result").value = codes[0].rawValue;
              scannerActive = false;
              await stopScanner();
              return;
            }
          } catch (error) {
            console.warn(error);
          }
          requestAnimationFrame(scan);
        };
        scan();
      } catch (error) {
        alert(error.message);
      }
    }

    async function stopScanner() {
      scannerActive = false;
      if (scannerStream) {
        scannerStream.getTracks().forEach((track) => track.stop());
        scannerStream = null;
      }
      const video = el("scanner-video");
      if (video) {
        video.pause();
        video.srcObject = null;
        video.classList.add("hidden");
      }
      el("stop-product-scanner")?.classList.add("hidden");
    }

    function escapeAttr(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    el("super-login").onclick = () => {
      const admins = superAdmins();
      el("login-users").innerHTML = admins.map((user) => `<option value="${user.name}"></option>`).join("");
      el("login-name").value = "";
      el("login-password").value = "";
      el("show-create-account").classList.toggle("hidden", admins.length > 0);
      el("create-account-panel").classList.add("hidden");
      el("login-modal").classList.remove("hidden");
    };
    el("cancel-login").onclick = () => el("login-modal").classList.add("hidden");
    el("toggle-password").onclick = () => {
      const input = el("login-password");
      input.type = input.type === "password" ? "text" : "password";
    };
    el("show-create-account").onclick = () => {
      if (superAdmins().length > 0) {
        alert("Super Admin sudah terdaftar. Hanya boleh ada satu akun Super Admin.");
        return;
      }
      el("create-account-panel").classList.toggle("hidden");
    };
    el("submit-login").onclick = async () => {
      try {
        const user = await gas("login", { name: el("login-name").value.trim(), password: el("login-password").value });
        loginAs(user);
      } catch (error) {
        alert(error.message);
      }
    };
    el("submit-create-account").onclick = async () => {
      try {
        const item = {
          name: el("create-name").value.trim(),
          password: el("create-password").value,
          role: "Super Admin",
          status: "Aktif"
        };
        await gas("add", { collection: "users", item });
        await load();
        const user = await gas("login", { name: item.name, password: item.password });
        loginAs(user);
      } catch (error) {
        alert(error.message);
      }
    };
    el("logout-super").onclick = () => {
      state.role = "Admin";
      state.currentUser = null;
      localStorage.removeItem("role");
      localStorage.removeItem("currentUser");
      renderShell();
      render();
    };

    function loginAs(user) {
      state.role = user.role;
      state.currentUser = user;
      localStorage.setItem("role", state.role);
      localStorage.setItem("currentUser", JSON.stringify(user));
      el("login-modal").classList.add("hidden");
      renderShell();
      render();
    }

    applyTheme();
    setInterval(() => el("clock").textContent = new Date().toLocaleString("id-ID"), 1000);
    load().catch((error) => el("content").innerHTML = `<div class="card"><h2>Error</h2><p>${error.message}</p></div>`);
  </script>
</body>
</html>
